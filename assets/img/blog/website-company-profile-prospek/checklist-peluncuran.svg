<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Checklist peluncuran website company profile</title><desc id="desc">Daftar pemeriksaan pesan, halaman layanan, kontak, konsistensi informasi, dan tindak lanjut.</desc><rect width="1200" height="700" fill="#FFFDF8"/><rect x="85" y="60" width="1030" height="580" rx="32" fill="#F0EBFF"/><text x="150" y="140" fill="#172B4D" font-family="system-ui" font-size="38" font-weight="700">Checklist sebelum peluncuran</text><g font-family="system-ui" font-size="25" fill="#172B4D"><g fill="#46B6E9"><circle cx="165" cy="220" r="18"/><circle cx="165" cy="300" r="18"/><circle cx="165" cy="380" r="18"/><circle cx="165" cy="460" r="18"/><circle cx="165" cy="540" r="18"/></g><g font-weight="600"><text x="210" y="229">Pesan utama jelas pada layar pertama</text><text x="210" y="309">Layanan prioritas punya halaman sendiri</text><text x="210" y="389">Formulir dan kanal kontak diuji</text><text x="210" y="469">Informasi bisnis konsisten</text><text x="210" y="549">Ada pemilik tindak lanjut prospek</text></g></g></svg>