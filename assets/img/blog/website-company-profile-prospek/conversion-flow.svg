<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Alur Konversi Prospek Website</title>
  <desc>Diagram alur dari kunjungan website hingga menjadi prospek bisnis yang terverifikasi.</desc>
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>
  <text x="50" y="50" fill="#172B4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Alur Konversi Pengunjung Menjadi Klien</text>
  <rect x="50" y="90" width="150" height="260" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="50" y="90" width="150" height="40" fill="#46B6E9" rx="8"/>
  <text x="75" y="115" fill="#172B4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">1. Kunjungan</text>
  <text x="70" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Pencarian lokal</text>
  <text x="70" y="190" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Iklan / SEO</text>
  <text x="70" y="220" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Rekomendasi</text>

  <rect x="230" y="90" width="150" height="260" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="230" y="90" width="150" height="40" fill="#7C5CE8" rx="8"/>
  <text x="255" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">2. Evaluasi</text>
  <text x="250" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Cek layanan</text>
  <text x="250" y="190" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Baca portofolio</text>
  <text x="250" y="220" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Nilai kredibilitas</text>

  <rect x="410" y="90" width="150" height="260" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="410" y="90" width="150" height="40" fill="#46B6E9" rx="8"/>
  <text x="435" y="115" fill="#172B4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">3. Kontak</text>
  <text x="430" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Isi formulir</text>
  <text x="430" y="190" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Klik WhatsApp</text>
  <text x="430" y="220" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Telepon langsung</text>

  <rect x="590" y="90" width="160" height="260" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="590" y="90" width="160" height="40" fill="#172B4D" rx="8"/>
  <text x="615" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">4. Klien / Prospek</text>
  <text x="610" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Diskusi penawaran</text>
  <text x="610" y="190" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Penilaian proyek</text>
  <text x="610" y="220" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Deal kerjasama</text>
</svg>
