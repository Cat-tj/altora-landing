<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Perbandingan Website Biasa vs Website Prospek</title>
  <desc>Perbandingan antara website company profile biasa yang pasif dan website yang dioptimalkan untuk menghasilkan prospek.</desc>
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>
  <text x="50" y="50" fill="#172B4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Perbandingan Kinerja Website Perusahaan</text>
  
  <rect x="50" y="90" width="330" height="280" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="50" y="90" width="330" height="40" fill="#E2E8F0" rx="8"/>
  <text x="80" y="115" fill="#172B4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Website Company Profile Pasif</text>
  <text x="70" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">❌ Berfokus pada sejarah &amp; ego perusahaan</text>
  <text x="70" y="200" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">❌ Menu layanan umum tanpa kejelasan</text>
  <text x="70" y="240" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">❌ Portofolio kosong atau foto stok</text>
  <text x="70" y="280" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">❌ Kontak tersembunyi / formulir rusak</text>
  <text x="70" y="320" fill="#E53E3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Hasil: Nol prospek bisnis</text>

  <rect x="420" y="90" width="330" height="280" fill="#FFFFFF" rx="8" stroke="#7C5CE8" stroke-width="2"/>
  <rect x="420" y="90" width="330" height="40" fill="#7C5CE8" rx="8"/>
  <text x="450" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Website Berbasis Prospek</text>
  <text x="440" y="160" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✔️ Berfokus pada solusi &amp; kebutuhan klien</text>
  <text x="440" y="200" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✔️ Layanan spesifik &amp; terstruktur jelas</text>
  <text x="440" y="240" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✔️ Bukti portofolio nyata &amp; studi kasus</text>
  <text x="440" y="280" fill="#4A5568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✔️ Jalur kontak langsung &amp; transparan</text>
  <text x="440" y="320" fill="#38A169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Hasil: Klien &amp; proyek berkualitas</text>
</svg>
