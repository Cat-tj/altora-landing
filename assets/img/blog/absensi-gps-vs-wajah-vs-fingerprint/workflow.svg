<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Alur Keputusan Pemilihan Sistem Absensi</title>
  <desc>Diagram alur untuk menentukan apakah perusahaan memerlukan absensi GPS, wajah, atau fingerprint berdasarkan mobilitas tim.</desc>
  <rect width="800" height="400" fill="#F8FAFC"/>
  
  <rect x="50" y="40" width="700" height="320" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="90" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#172B4D">Alur Keputusan Pemilihan Absensi</text>
  
  <!-- Step 1 -->
  <rect x="90" y="120" width="160" height="80" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="170" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#172B4D" text-anchor="middle">Tim Mobilitas Tinggi?</text>
  <text x="170" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Sales / Lapangan / Proyek</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="160" x2="310" y2="160" stroke="#7C5CE8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2A (GPS) -->
  <rect x="310" y="120" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#46B6E9" stroke-width="1"/>
  <text x="390" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">Gunakan GPS</text>
  <text x="390" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0369A1" text-anchor="middle">Validasi Geofencing</text>

  <!-- Step 1B (Office) -->
  <rect x="90" y="240" width="160" height="80" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="170" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#172B4D" text-anchor="middle">Kantor / Pabrik Tetap?</text>
  <text x="170" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Titik Masuk Terpusat</text>

  <line x1="170" y1="200" x2="170" y2="240" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Arrow 2 -->
  <line x1="250" y1="280" x2="310" y2="280" stroke="#7C5CE8" stroke-width="2"/>

  <!-- Step 2B (Wajah / Finger) -->
  <rect x="310" y="240" width="160" height="80" rx="6" fill="#F5F3FF" stroke="#7C5CE8" stroke-width="1"/>
  <text x="390" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6" text-anchor="middle">Wajah / Fingerprint</text>
  <text x="390" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5B21B6" text-anchor="middle">Perangkat Fisik / Tablet</text>

  <!-- Output Result Box -->
  <rect x="510" y="120" width="200" height="200" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="610" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#172B4D" text-anchor="middle">Hasil Keputusan</text>
  <text x="530" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Lapangan: GPS + Radius</text>
  <text x="530" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Pabrik: Wajah (Higienis)</text>
  <text x="530" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Kantor: Finger / Wajah</text>
  <text x="530" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Integrasi Dashboard Pusat</text>

  <line x1="470" y1="160" x2="510" y2="160" stroke="#CBD5E1" stroke-dasharray="4" stroke-width="2"/>
  <line x1="470" y1="280" x2="510" y2="280" stroke="#CBD5E1" stroke-dasharray="4" stroke-width="2"/>
</svg>
