<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Perbandingan Metode Absensi Lapangan</title>
  <desc>Ilustrasi perbandingan metode absensi GPS, pengenalan wajah, dan fingerprint untuk tim lapangan dan operasional.</desc>
  <rect width="800" height="450" fill="#F8FAFC"/>
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="90" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#172B4D">Metode Absensi untuk Tim Lapangan</text>
  <text x="90" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B">Pemilihan teknologi absensi yang sesuai dengan karakteristik lokasi kerja di Kalimantan Timur.</text>
  
  <!-- GPS Card -->
  <rect x="90" y="170" width="180" height="190" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="180" cy="210" r="24" fill="#46B6E9" opacity="0.2"/>
  <text x="180" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="middle">GPS</text>
  <text x="110" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Ideal untuk tim mobilitas tinggi</text>
  <text x="110" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Validasi radius lokasi</text>
  <text x="110" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Tanpa antre perangkat fisik</text>

  <!-- Wajah Card -->
  <rect x="310" y="170" width="180" height="190" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="400" cy="210" r="24" fill="#7C5CE8" opacity="0.2"/>
  <text x="400" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="middle">Wajah</text>
  <text x="330" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Higienis &amp; cepat</text>
  <text x="330" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Anti-titip absen</text>
  <text x="330" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Perlu pencahayaan cukup</text>

  <!-- Fingerprint Card -->
  <rect x="530" y="170" width="180" height="190" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="620" cy="210" r="24" fill="#10B981" opacity="0.2"/>
  <text x="620" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="middle">Finger</text>
  <text x="550" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Standar kantor statis</text>
  <text x="550" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Andal di ruangan tertutup</text>
  <text x="550" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• Rentan debu &amp; aus</text>
</svg>
