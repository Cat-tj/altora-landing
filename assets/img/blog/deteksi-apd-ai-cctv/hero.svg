<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Deteksi APD dengan AI CCTV di Proyek Konstruksi</title>
  <desc>Ilustrasi sistem AI CCTV yang mendeteksi penggunaan Alat Pelindung Diri secara otomatis di lokasi konstruksi.</desc>
  <style>
    .bg { fill: #F8F9FA; }
    .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #172B4D; }
    .text-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4A5568; }
    .accent { fill: #7C5CE8; }
    .badge-green { fill: #E6FFFA; stroke: #319795; stroke-width: 1.5; rx: 4; }
    .badge-red { fill: #FFF5F5; stroke: #E53E3E; stroke-width: 1.5; rx: 4; }
    .badge-text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #234E52; }
    .badge-text-red { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #742A2A; }
    .box-zone { fill: none; stroke: #46B6E9; stroke-width: 2; stroke-dasharray: 4; rx: 4; }
  </style>
  <rect width="800" height="400" class="bg"/>
  
  <text x="40" y="45" class="text-title">AI CCTV Monitoring APD Konstruksi</text>
  <text x="40" y="70" class="text-body">Pemantauan kepatuhan helm dan rompi keselamatan secara otomatis real-time.</text>

  <rect x="40" y="90" width="340" height="260" class="card"/>
  <rect x="60" y="110" width="300" height="180" fill="#EDF2F7" rx="4"/>
  <circle cx="210" cy="150" r="20" fill="#CBD5E0"/>
  <rect x="190" y="175" width="40" height="80" rx="6" fill="#CBD5E0"/>
  <rect x="185" y="125" width="50" height="45" class="box-zone"/>
  <rect x="180" y="170" width="60" height="90" class="box-zone"/>
  <text x="60" y="320" class="text-body" font-weight="bold">Kamera Area Proyek #3</text>

  <rect x="420" y="90" width="340" height="260" class="card"/>
  <text x="450" y="130" class="text-title" font-size="16px">Status Kepatuhan K3</text>
  
  <rect x="450" y="155" width="280" height="40" class="badge-green"/>
  <text x="470" y="180" class="badge-text-green">✓ Helm Pengaman Terdeteksi (Valid)</text>

  <rect x="450" y="205" width="280" height="40" class="badge-green"/>
  <text x="470" y="230" class="badge-text-green">✓ Rompi Reflektif Terdeteksi (Valid)</text>

  <rect x="450" y="255" width="280" height="40" class="badge-red"/>
  <text x="470" y="280" class="badge-text-red">⚠ Sepatu Safety Tidak Terdeteksi</text>

  <text x="450" y="325" class="text-body" font-size="11px"><tspan x="450" dy="0">Sistem mencatat log otomatis &amp; peringatan</tspan><tspan x="450" dy="17.6">suara/dashboard.</tspan></text>
</svg>