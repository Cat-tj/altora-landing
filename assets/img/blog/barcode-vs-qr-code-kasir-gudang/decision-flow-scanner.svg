<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <title>Alur Keputusan Memilih Barcode atau QR Code</title>
  <desc>Diagram pohon keputusan praktis untuk pemilik bisnis dalam menentukan penggunaan barcode 1D atau QR code 2D sesuai kebutuhan operasional.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #172B4D; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #6B778C; }
      .box-start { fill: #FFFFFF; stroke: #7C5CE8; stroke-width: 2; rx: 10; }
      .box-decision { fill: #FFFFFF; stroke: #46B6E9; stroke-width: 2; rx: 8; }
      .box-barcode { fill: #E6FCFF; stroke: #008DA6; stroke-width: 2; rx: 10; }
      .box-qrcode { fill: #EAE6FF; stroke: #5243AA; stroke-width: 2; rx: 10; }
      .text-start { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #172B4D; text-anchor: middle; }
      .text-q { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #172B4D; text-anchor: middle; }
      .text-res-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .text-res-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #42526E; text-anchor: middle; }
      .line { stroke: #A5B2C6; stroke-width: 1.5; fill: none; }
      .arrow { fill: #A5B2C6; }
      .label-yes { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #00875A; }
      .label-no { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #DE350B; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Header -->
  <text x="40" y="44" class="title-text">Panduan Alur Keputusan: Barcode 1D vs QR Code 2D</text>
  <text x="40" y="66" class="subtitle">Ikuti alur logika berikut untuk menentukan format identifikasi terbaik bagi titik kerja Anda</text>

  <!-- Step 1: Start -->
  <rect x="290" y="90" width="220" height="50" class="box-start"/>
  <text x="400" y="112" class="text-start">Apakah data yang perlu ditempel</text>
  <text x="400" y="128" class="text-start">hanya ID produk / nomor SKU?</text>

  <!-- Connector from Step 1 -->
  <!-- Left branch (Yes -> Step 2A) -->
  <path d="M 290 115 L 180 115 L 180 180" class="line"/>
  <polygon points="177,175 180,183 183,175" class="arrow"/>
  <text x="220" y="108" class="label-yes">YA (Hanya ID)</text>

  <!-- Right branch (No -> Step 2B) -->
  <path d="M 510 115 L 620 115 L 620 180" class="line"/>
  <polygon points="617,175 620,183 623,175" class="arrow"/>
  <text x="525" y="108" class="label-no">TIDAK (Butuh Lot/Exp/URL)</text>

  <!-- Step 2A (Left decision): Checkout Speed Priority -->
  <rect x="80" y="185" width="200" height="60" class="box-decision"/>
  <text x="180" y="210" class="text-q">Apakah dipindai cepat di kasir</text>
  <text x="180" y="226" class="text-q">atau kemasan produk sudah ada barcode?</text>

  <!-- Step 2B (Right decision): Warehouse / Environment condition -->
  <rect x="520" y="185" width="200" height="60" class="box-decision"/>
  <text x="620" y="210" class="text-q">Apakah label rawan kotor / robek,</text>
  <text x="620" y="226" class="text-q">atau discan pakai smartphone?</text>

  <!-- Branches from 2A -->
  <!-- 2A -> Yes -> Barcode 1D -->
  <path d="M 140 245 L 140 310" class="line"/>
  <polygon points="137,305 140,313 143,305" class="arrow"/>
  <text x="145" y="275" class="label-yes">YA</text>

  <!-- 2A -> No -> Hybrid / QR -->
  <path d="M 220 245 L 220 280 L 330 280 L 330 310" class="line"/>
  <polygon points="327,305 330,313 333,305" class="arrow"/>
  <text x="225" y="265" class="label-no">TIDAK</text>

  <!-- Branches from 2B -->
  <!-- 2B -> Yes -> QR Code 2D -->
  <path d="M 660 245 L 660 310" class="line"/>
  <polygon points="657,305 660,313 663,305" class="arrow"/>
  <text x="665" y="275" class="label-yes">YA</text>

  <!-- 2B -> No -> Hybrid -->
  <path d="M 580 245 L 580 280 L 470 280 L 470 310" class="line"/>
  <polygon points="467,305 470,313 473,305" class="arrow"/>
  <text x="535" y="265" class="label-no">TIDAK</text>

  <!-- Results Row -->
  <!-- Result 1: Barcode 1D (Left) -->
  <rect x="40" y="315" width="200" height="95" class="box-barcode"/>
  <text x="140" y="340" class="text-res-title" fill="#008DA6">Gunakan Barcode 1D</text>
  <text x="140" y="360" class="text-res-desc">Standar EAN/UPC/Code128</text>
  <text x="140" y="378" class="text-res-desc">Sangat cepat di kasir POS</text>
  <text x="140" y="396" class="text-res-desc">Biaya scanner laser sangat hemat</text>

  <!-- Result 2: Hybrid Approach (Center) -->
  <rect x="290" y="315" width="220" height="95" class="box-decision" style="border-style:dashed;"/>
  <text x="400" y="340" class="text-res-title" fill="#172B4D">Kombinasi Hybrid</text>
  <text x="400" y="360" class="text-res-desc">1D di tingkat unit kemasan ritel</text>
  <text x="400" y="378" class="text-res-desc">QR Code di kardus/palet gudang</text>
  <text x="400" y="396" class="text-res-desc">Ideal untuk UMKM bertumbuh</text>

  <!-- Result 3: QR Code 2D (Right) -->
  <rect x="560" y="315" width="200" height="95" class="box-qrcode"/>
  <text x="660" y="340" class="text-res-title" fill="#5243AA">Gunakan QR Code 2D</text>
  <text x="660" y="360" class="text-res-desc">Standar QR Code / ISO 18004</text>
  <text x="660" y="378" class="text-res-desc">Tahan robek (error correction)</text>
  <text x="660" y="396" class="text-res-desc">Dapat dipindai kamera HP staf</text>
</svg>
