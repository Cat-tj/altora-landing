<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <title>Langkah Implementasi Standarisasi Label Kasir dan Gudang</title>
  <desc>Panduan 4 langkah praktis menerapkan sistem barcode dan QR code terpadu untuk operasional kasir dan manajemen gudang UMKM.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #172B4D; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #6B778C; }
      .step-card { fill: #FFFFFF; stroke: #DFE1E6; stroke-width: 1.5; rx: 12; }
      .num-circle-1 { fill: #E6FCFF; stroke: #46B6E9; stroke-width: 2; }
      .num-circle-2 { fill: #EAE6FF; stroke: #7C5CE8; stroke-width: 2; }
      .num-circle-3 { fill: #E6FCFF; stroke: #008DA6; stroke-width: 2; }
      .num-circle-4 { fill: #EAE6FF; stroke: #5243AA; stroke-width: 2; }
      .num-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #172B4D; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #42526E; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Header -->
  <text x="40" y="44" class="title-text">4 Tahap Penerapan Label Barcode &amp; QR Code Operasional</text>
  <text x="40" y="66" class="subtitle">Langkah praktis menyelaraskan alur identifikasi barang dari penerimaan gudang hingga meja kasir</text>

  <!-- Step 1 -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="345" height="135" class="step-card"/>
    <circle cx="36" cy="36" r="20" class="num-circle-1"/>
    <text x="36" y="42" class="num-text" fill="#008DA6">1</text>
    <text x="70" y="32" class="step-title">Petakan Kebutuhan Tiap Titik</text>
    <text x="70" y="52" class="step-desc">Pisahkan alur kecepatan tinggi di kasir</text>
    <text x="70" y="70" class="step-desc">(barcode 1D) dengan alur data detail di</text>
    <text x="70" y="88" class="step-desc">gudang atau pelacakan aset (QR code 2D).</text>
    <text x="70" y="112" class="step-desc" font-weight="600" fill="#172B4D">Output: Pemetaan format per jenis barang</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(415, 95)">
    <rect x="0" y="0" width="345" height="135" class="step-card"/>
    <circle cx="36" cy="36" r="20" class="num-circle-2"/>
    <text x="36" y="42" class="num-text" fill="#5243AA">2</text>
    <text x="70" y="32" class="step-title">Standarisasi Format Penomoran SKU</text>
    <text x="70" y="52" class="step-desc">Buat format kode unik yang konsisten</text>
    <text x="70" y="70" class="step-desc">(misal: Kategori-Merek-Varian). Hindari</text>
    <text x="70" y="88" class="step-desc">karakter spesial yang membingungkan alat scan.</text>
    <text x="70" y="112" class="step-desc" font-weight="600" fill="#172B4D">Output: Master data produk yang rapi</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="345" height="135" class="step-card"/>
    <circle cx="36" cy="36" r="20" class="num-circle-3"/>
    <text x="36" y="42" class="num-text" fill="#008DA6">3</text>
    <text x="70" y="32" class="step-title">Pilih Printer &amp; Material Stiker Label</text>
    <text x="70" y="52" class="step-desc">Gunakan printer thermal yang presisi.</text>
    <text x="70" y="70" class="step-desc">Pilih kertas tahan minyak/debu untuk gudang</text>
    <text x="70" y="88" class="step-desc">dan stiker label standar untuk rak display toko.</text>
    <text x="70" y="112" class="step-desc" font-weight="600" fill="#172B4D">Output: Kualitas cetak barcode tajam &amp; awet</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(415, 250)">
    <rect x="0" y="0" width="345" height="135" class="step-card"/>
    <circle cx="36" cy="36" r="20" class="num-circle-4"/>
    <text x="36" y="42" class="num-text" fill="#5243AA">4</text>
    <text x="70" y="32" class="step-title">Integrasi POS &amp; Pelatihan Staf</text>
    <text x="70" y="52" class="step-desc">Hubungkan pemindai ke sistem kasir POS.</text>
    <text x="70" y="70" class="step-desc">Latih staf cara scanning beruntun otomatis</text>
    <text x="70" y="88" class="step-desc">dan penanganan saat label mengalami cacat fisik.</text>
    <text x="70" y="112" class="step-desc" font-weight="600" fill="#172B4D">Output: Transaksi kasir lancar tanpa antrean</text>
  </g>
</svg>
