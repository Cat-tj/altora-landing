<svg width="1200" height="650" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Checklist pilot fleet management</title><desc id="d">Empat langkah pilot: pilih masalah, petakan proses, uji kondisi nyata, lalu perbaiki sebelum perluasan.</desc><rect width="1200" height="650" fill="#FAF7F2"/><text x="70" y="90" fill="#172B4D" font-family="sans-serif" font-size="38" font-weight="700">Mulai kecil, uji alur nyata, baru perluas</text><g font-family="sans-serif"><path d="M155 345H1045" stroke="#7C5CE8" stroke-width="8"/><g fill="#7C5CE8"><circle cx="180" cy="345" r="38"/><circle cx="465" cy="345" r="38"/><circle cx="750" cy="345" r="38"/><circle cx="1035" cy="345" r="38"/></g><g fill="#fff" text-anchor="middle" font-size="25" font-weight="700"><text x="180" y="354">1</text><text x="465" y="354">2</text><text x="750" y="354">3</text><text x="1035" y="354">4</text></g><g fill="#172B4D" text-anchor="middle" font-size="25" font-weight="700"><text x="180" y="250">Pilih masalah</text><text x="465" y="250">Petakan alur</text><text x="750" y="250">Uji kondisi nyata</text><text x="1035" y="250">Perbaiki &amp; perluas</text></g><g fill="#52657F" text-anchor="middle" font-size="18"><text x="180" y="445">keputusan yang</text><text x="180" y="470">sering terlambat</text><text x="465" y="445">status, peran,</text><text x="465" y="470">dan akses data</text><text x="750" y="445">rute, koneksi,</text><text x="750" y="470">pergantian kru</text><text x="1035" y="445">SOP sebelum</text><text x="1035" y="470">semua unit masuk</text></g></g></svg>