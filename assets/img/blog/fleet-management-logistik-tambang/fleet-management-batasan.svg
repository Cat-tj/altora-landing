<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Batasan data lokasi armada</title><desc id="d">Perbandingan antara informasi yang dapat ditunjukkan sistem dan hal yang tetap memerlukan konfirmasi manusia.</desc><rect width="1200" height="620" fill="#FAF7F2"/><text x="70" y="90" fill="#172B4D" font-family="sans-serif" font-size="38" font-weight="700">Data lokasi perlu konteks lapangan</text><g font-family="sans-serif"><rect x="70" y="155" width="480" height="340" rx="24" fill="#E9F7FD" stroke="#46B6E9" stroke-width="3"/><rect x="650" y="155" width="480" height="340" rx="24" fill="#FFF2E6" stroke="#F39A48" stroke-width="3"/><text x="110" y="220" fill="#172B4D" font-size="29" font-weight="700">Sistem dapat menunjukkan</text><text x="690" y="220" fill="#172B4D" font-size="29" font-weight="700">Manusia perlu memastikan</text><g fill="#52657F" font-size="23"><text x="110" y="280">• posisi terakhir</text><text x="110" y="330">• status yang tercatat</text><text x="110" y="380">• jejak perjalanan</text><text x="690" y="280">• alasan kendaraan berhenti</text><text x="690" y="330">• kondisi akses atau lokasi</text><text x="690" y="380">• tindakan dan eskalasi</text></g></g></svg>