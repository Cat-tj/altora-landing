<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Alur fleet management dari tugas hingga penutupan</title><desc id="d">Diagram alur tugas armada: rencanakan, jalankan, pantau pengecualian, catat kejadian, dan tutup tugas.</desc><rect width="1200" height="630" fill="#FAF7F2"/><text x="70" y="92" fill="#172B4D" font-family="sans-serif" font-size="38" font-weight="700">Dari tugas ke penutupan yang dapat ditelusuri</text><g font-family="sans-serif" text-anchor="middle"><g fill="#EEE9FF" stroke="#7C5CE8" stroke-width="3"><rect x="70" y="220" width="185" height="150" rx="22"/><rect x="290" y="220" width="185" height="150" rx="22"/><rect x="510" y="220" width="185" height="150" rx="22"/><rect x="730" y="220" width="185" height="150" rx="22"/><rect x="950" y="220" width="185" height="150" rx="22"/></g><g fill="#172B4D" font-size="23" font-weight="700"><text x="162" y="280">1. Buat tugas</text><text x="382" y="280">2. Berangkat</text><text x="602" y="280">3. Pantau</text><text x="822" y="280">4. Catat</text><text x="1042" y="280">5. Tutup</text></g><g fill="#172B4D" font-size="17"><text x="162" y="315">tujuan + PIC</text><text x="382" y="315">kendaraan + kru</text><text x="602" y="315">pengecualian</text><text x="822" y="315">kejadian nyata</text><text x="1042" y="315">dokumen lengkap</text></g><g stroke="#46B6E9" stroke-width="7" fill="none"><path d="M255 295h30"/><path d="M475 295h30"/><path d="M695 295h30"/><path d="M915 295h30"/></g></g><text x="70" y="510" fill="#52657F" font-family="sans-serif" font-size="23">Fokus: informasi yang memicu tindakan, bukan sekadar titik di peta.</text></svg>