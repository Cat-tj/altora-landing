<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Data inti untuk mengelola armada</title><desc id="d">Enam kartu menunjukkan identitas tugas, status perjalanan, posisi dan rute, waktu, kejadian, serta kesiapan kendaraan.</desc><rect width="1200" height="680" fill="#FAF7F2"/><text x="65" y="86" fill="#172B4D" font-family="sans-serif" font-size="38" font-weight="700">Data yang perlu punya tujuan operasional</text><g font-family="sans-serif"><g fill="#FFF" stroke="#D8D0F8" stroke-width="3"><rect x="65" y="145" width="330" height="185" rx="20"/><rect x="435" y="145" width="330" height="185" rx="20"/><rect x="805" y="145" width="330" height="185" rx="20"/><rect x="65" y="375" width="330" height="185" rx="20"/><rect x="435" y="375" width="330" height="185" rx="20"/><rect x="805" y="375" width="330" height="185" rx="20"/></g><g fill="#7C5CE8" font-size="25" font-weight="700"><text x="95" y="200">Identitas tugas</text><text x="465" y="200">Status perjalanan</text><text x="835" y="200">Posisi &amp; rute</text><text x="95" y="430">Waktu operasional</text><text x="465" y="430">Kejadian lapangan</text><text x="835" y="430">Kesiapan kendaraan</text></g><g fill="#52657F" font-size="19"><text x="95" y="245">tujuan • kendaraan • PIC</text><text x="465" y="245">berangkat • tiba • selesai</text><text x="835" y="245">lokasi terakhir • jejak</text><text x="95" y="475">rencana • aktual • tunggu</text><text x="465" y="475">kendala • perubahan • bukti</text><text x="835" y="475">perawatan • dokumen • status</text></g></g></svg>