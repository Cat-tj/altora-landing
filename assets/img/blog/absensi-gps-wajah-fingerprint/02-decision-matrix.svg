<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Matriks Evaluasi Teknologi Absensi</title>
  <desc>Perbandingan keandalan, higienitas, dan fleksibilitas berbagai jenis absensi.</desc>
  <rect width="800" height="400" fill="#F8FAFC" rx="12"/>
  <rect x="40" y="40" width="720" height="320" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Parameter Kelayakan Sistem Absensi</text>
  
  <!-- Table Header -->
  <rect x="70" y="110" width="660" height="40" fill="#F1F5F9" rx="4"/>
  <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Teknologi</text>
  <text x="260" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Lingkungan Kerja</text>
  <text x="450" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Tingkat Keamanan</text>
  <text x="610" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Mobilitas</text>

  <!-- Row 1 -->
  <line x1="70" y1="170" x2="730" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7C5CE8">Fingerprint</text>
  <text x="260" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Kantor Tertutup</text>
  <text x="450" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Sedang (Bisa Titip)</text>
  <text x="610" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Rendah (Tetap)</text>

  <!-- Row 2 -->
  <line x1="70" y1="230" x2="730" y2="230" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#46B6E9">Face Recognition</text>
  <text x="260" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Gerbang / Pabrik</text>
  <text x="450" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#16A34A" font-weight="600">Tinggi (Nirsentuh)</text>
  <text x="610" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Rendah (Tetap)</text>

  <!-- Row 3 -->
  <line x1="70" y1="290" x2="730" y2="290" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16A34A">GPS Mobile App</text>
  <text x="260" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Lapangan / Proyek</text>
  <text x="450" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">Tinggi (+ Anti Spoof)</text>
  <text x="610" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#16A34A" font-weight="600">Sangat Tinggi</text>
</svg>
