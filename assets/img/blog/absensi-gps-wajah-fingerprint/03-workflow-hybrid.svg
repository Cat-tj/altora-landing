<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <title>Arsitektur Integrasi Data Kehadiran Hibrida</title>
  <desc>Alur penggabungan data dari berbagai titik ke sistem pusat.</desc>
  <rect width="800" height="350" fill="#F8FAFC" rx="12"/>
  <rect x="40" y="40" width="720" height="270" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Integrasi Data Kehadiran Multi-Sumber</text>
  
  <!-- Sources -->
  <rect x="70" y="120" width="180" height="50" fill="#F1F5F9" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="160" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D" text-anchor="middle">Kantor: Face / Finger</text>

  <rect x="70" y="190" width="180" height="50" fill="#F1F5F9" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="160" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D" text-anchor="middle">Lapangan: GPS Mobile</text>

  <!-- Arrow -->
  <path d="M260 175 L340 175" stroke="#7C5CE8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Central Cloud / System -->
  <rect x="350" y="120" width="180" height="120" fill="#E0E7FF" rx="8"/>
  <text x="440" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#3730A3" text-anchor="middle">Altora Cloud</text>
  <text x="440" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4338CA" text-anchor="middle">Central Engine &amp;</text>
  <text x="440" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4338CA" text-anchor="middle">Rekap Gaji Otomatis</text>

  <!-- Arrow -->
  <path d="M540 175 L620 175" stroke="#7C5CE8" stroke-width="2"/>

  <!-- Output -->
  <rect x="630" y="120" width="100" height="120" fill="#F8FAFC" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="680" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D" text-anchor="middle">Dashboard</text>
  <text x="680" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#172B4D" text-anchor="middle">HR / Payroll</text>
</svg>
