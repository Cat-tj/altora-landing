<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <title>Peta Orientasi Absensi Lapangan dan Kantor</title>
  <desc>Diagram perbandingan tiga pilar teknologi absensi: Sidik Jari, Wajah, dan GPS untuk berbagai profil kerja.</desc>
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Header -->
  <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#172B4D">Ekosistem Absensi Multi-Lokasi</text>
  <text x="70" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B">Cocokkan karakteristik kerja dengan teknologi pencatatan kehadiran.</text>
  
  <!-- Card 1: Fingerprint -->
  <rect x="70" y="140" width="210" height="230" fill="#F1F5F9" rx="6"/>
  <rect x="90" y="160" width="40" height="40" fill="#E0E7FF" rx="6"/>
  <path d="M110 170v20m-10-10h20" stroke="#7C5CE8" stroke-width="2" stroke-linecap="round"/>
  <text x="145" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#172B4D">Fingerprint</text>
  <text x="90" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155"><tspan x="90" dy="0">Ideal untuk kantor tertutup</tspan><tspan x="90" dy="17.6">&amp; staf stabil.</tspan></text>
  <text x="90" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B"><tspan x="90" dy="0">• Sensor optik/kapasitif</tspan><tspan x="90" dy="16.8">• Rentan debu &amp; keringat</tspan><tspan x="90" dy="16.8">• Titik antrean fisik</tspan></text>

  <!-- Card 2: Face Recognition -->
  <rect x="295" y="140" width="210" height="230" fill="#F1F5F9" rx="6"/>
  <rect x="315" y="160" width="40" height="40" fill="#E0F2FE" rx="6"/>
  <circle cx="335" cy="180" r="10" stroke="#46B6E9" stroke-width="2" fill="none"/>
  <text x="370" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#172B4D">Face Recog</text>
  <text x="315" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155"><tspan x="315" dy="0">Nirsentuh dan membantu</tspan><tspan x="315" dy="17.6">cek identitas.</tspan></text>
  <text x="315" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B"><tspan x="315" dy="0">• Kamera AI &amp; biometrik</tspan><tspan x="315" dy="16.8">• Butuh daya &amp; listrik stabil</tspan><tspan x="315" dy="16.8">• Cocok gerbang pabrik</tspan></text>

  <!-- Card 3: GPS Mobile -->
  <rect x="520" y="140" width="210" height="230" fill="#F1F5F9" rx="6"/>
  <rect x="540" y="160" width="40" height="40" fill="#DCFCE7" rx="6"/>
  <path d="M560 170c-5 0-10 5-10 10 0 8 10 15 10 15s10-7 10-15c0-5-5-10-10-10z" stroke="#16A34A" stroke-width="2" fill="none"/>
  <text x="595" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#172B4D">GPS Mobile</text>
  <text x="540" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155"><tspan x="540" dy="0">Fleksibel untuk tim</tspan><tspan x="540" dy="17.6">bergerak di lapangan.</tspan></text>
  <text x="540" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B"><tspan x="540" dy="0">• Koordinat lokasi &amp; selfie</tspan><tspan x="540" dy="16.8">• Perlu proteksi spoofing</tspan><tspan x="540" dy="16.8">• Cocok sales &amp; proyek</tspan></text>
</svg>