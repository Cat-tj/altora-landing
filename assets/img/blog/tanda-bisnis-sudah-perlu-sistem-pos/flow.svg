<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <title>Alur Kerja Sistem POS Terintegrasi</title>
  <desc>Diagram alur dari transaksi kasir, pemotongan inventaris, hingga pelaporan keuangan otomatis.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <g transform="translate(40, 60)">
    <rect width="200" height="150" fill="#FFFFFF" stroke="#46B6E9" stroke-width="2" rx="8"/>
    <text x="20" y="35" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold">1. Transaksi Kasir</text>
    <text x="20" y="70" fill="#4A5568" font-family="sans-serif" font-size="13">Scan barcode produk</text>
    <text x="20" y="95" fill="#4A5568" font-family="sans-serif" font-size="13">atau pilih menu pesanan</text>
    <text x="20" y="120" fill="#4A5568" font-family="sans-serif" font-size="13">di layar sentuh POS.</text>

    <path d="M 220 135 L 260 135" stroke="#CBD5E0" stroke-width="3"/>

    <g transform="translate(280, 0)">
      <rect width="200" height="150" fill="#FFFFFF" stroke="#46B6E9" stroke-width="2" rx="8"/>
      <text x="20" y="35" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold">2. Potong Stok</text>
      <text x="20" y="70" fill="#4A5568" font-family="sans-serif" font-size="13">Inventaris gudang</text>
      <text x="20" y="95" fill="#4A5568" font-family="sans-serif" font-size="13">terupdate otomatis</text>
      <text x="20" y="120" fill="#4A5568" font-family="sans-serif" font-size="13">tanpa hitung manual.</text>
    </g>

    <path d="M 500 135 L 540 135" stroke="#CBD5E0" stroke-width="3"/>

    <g transform="translate(560, 0)">
      <rect width="200" height="150" fill="#FFFFFF" stroke="#7C5CE8" stroke-width="2" rx="8"/>
      <text x="20" y="35" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold">3. Laporan Instan</text>
      <text x="20" y="70" fill="#4A5568" font-family="sans-serif" font-size="13">Omset harian &amp; laba</text>
      <text x="20" y="95" fill="#4A5568" font-family="sans-serif" font-size="13">langsung terlihat di</text>
      <text x="20" y="120" fill="#4A5568" font-family="sans-serif" font-size="13">dashboard pemilik.</text>
    </g>
  </g>
</svg>