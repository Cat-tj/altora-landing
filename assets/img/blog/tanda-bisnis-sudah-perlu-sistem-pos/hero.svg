<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Transisi dari Buku Kas ke Sistem POS Modern</title>
  <desc>Ilustrasi perbandingan operasional manual buku kas dengan sistem POS digital terintegrasi untuk bisnis retail dan F&amp;B.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <g transform="translate(50, 50)">
    <rect width="300" height="300" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8"/>
    <text x="30" y="45" fill="#172B4D" font-family="sans-serif" font-size="18" font-weight="bold">Metode Manual (Buku Kas)</text>
    <rect x="30" y="70" width="240" height="40" fill="#FFF5F5" rx="4"/>
    <text x="45" y="95" fill="#C53030" font-family="sans-serif" font-size="14">Rekap harian lambat &amp; rawan selisih</text>
    <rect x="30" y="125" width="240" height="40" fill="#FFF5F5" rx="4"/>
    <text x="45" y="150" fill="#C53030" font-family="sans-serif" font-size="14">Stok opname manual melelahkan</text>
    <rect x="30" y="180" width="240" height="40" fill="#FFF5F5" rx="4"/>
    <text x="45" y="205" fill="#C53030" font-family="sans-serif" font-size="14">Laporan keuangan tidak real-time</text>
  </g>
  <g transform="translate(450, 50)">
    <rect width="300" height="300" fill="#FFFFFF" stroke="#7C5CE8" stroke-width="2" rx="8"/>
    <text x="30" y="45" fill="#172B4D" font-family="sans-serif" font-size="18" font-weight="bold">Sistem POS Digital</text>
    <rect x="30" y="70" width="240" height="40" fill="#F3F0FF" rx="4"/>
    <text x="45" y="95" fill="#7C5CE8" font-family="sans-serif" font-size="14" font-weight="bold">Transaksi otomatis &amp; cepat</text>
    <rect x="30" y="125" width="240" height="40" fill="#F3F0FF" rx="4"/>
    <text x="45" y="150" fill="#7C5CE8" font-family="sans-serif" font-size="14" font-weight="bold">Potong stok otomatis tiap terjual</text>
    <rect x="30" y="180" width="240" height="40" fill="#F3F0FF" rx="4"/>
    <text x="45" y="205" fill="#7C5CE8" font-family="sans-serif" font-size="14" font-weight="bold">Dashboard laporan laba real-time</text>
  </g>
</svg>