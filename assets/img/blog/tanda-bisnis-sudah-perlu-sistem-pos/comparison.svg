<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <title>Matriks Keputusan: Buku Kas vs Sistem POS</title>
  <desc>Tabel perbandingan parameter operasional bisnis antara pencatatan buku kas konvensional dan sistem POS modern.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <g transform="translate(50, 40)">
    <rect width="700" height="40" fill="#172B4D" rx="4"/>
    <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Parameter Bisnis</text>
    <text x="280" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Buku Kas / Manual</text>
    <text x="510" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Sistem POS Digital</text>

    <rect y="50" width="700" height="50" fill="#FFFFFF" rx="4"/>
    <text x="20" y="80" fill="#172B4D" font-family="sans-serif" font-size="13" font-weight="bold">Kecepatan Transaksi</text>
    <text x="280" y="80" fill="#C53030" font-family="sans-serif" font-size="13">Lambat (Antrean panjang)</text>
    <text x="510" y="80" fill="#2F855A" font-family="sans-serif" font-size="13">Cepat (Scan barcode)</text>

    <rect y="110" width="700" height="50" fill="#F8F9FA" rx="4"/>
    <text x="20" y="140" fill="#172B4D" font-family="sans-serif" font-size="13" font-weight="bold">Kontrol Stok</text>
    <text x="280" y="140" fill="#C53030" font-family="sans-serif" font-size="13">Sering selisih / hilang</text>
    <text x="510" y="140" fill="#2F855A" font-family="sans-serif" font-size="13">Real-time &amp; akurat</text>

    <rect y="170" width="700" height="50" fill="#FFFFFF" rx="4"/>
    <text x="20" y="200" fill="#172B4D" font-family="sans-serif" font-size="13" font-weight="bold">Laporan Keuangan</text>
    <text x="280" y="200" fill="#C53030" font-family="sans-serif" font-size="13">Butuh berjam-jam rekap</text>
    <text x="510" y="200" fill="#2F855A" font-family="sans-serif" font-size="13">Instan per klik</text>

    <rect y="230" width="700" height="50" fill="#F8F9FA" rx="4"/>
    <text x="20" y="260" fill="#172B4D" font-family="sans-serif" font-size="13" font-weight="bold">Pemantauan Pemilik</text>
    <text x="280" y="260" fill="#C53030" font-family="sans-serif" font-size="13">Harus cek fisik di toko</text>
    <text x="510" y="260" fill="#2F855A" font-family="sans-serif" font-size="13">Bisa dipantau dari mana saja</text>
  </g>
</svg>