<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background:#FBF9FD;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;">
  <defs>
    <linearGradient id="gradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CE8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5E3CC4" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#091E42" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="40" y="56" font-size="18" font-weight="700" fill="#091E42">Sistem Verifikasi Kehadiran Tim Lapangan: GPS, Wajah &amp; Biometrik</text>

  <!-- Card 1: GPS & Geofencing -->
  <g transform="translate(40, 105)">
    <rect width="220" height="275" rx="10" fill="#FFFFFF" stroke="#ECE4F7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="220" height="42" rx="10" fill="#F4F0FD"/>
    <circle cx="28" cy="21" r="10" fill="#7C5CE8"/>
    <text x="25" y="25" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
    <text x="48" y="26" font-size="13" font-weight="700" fill="#091E42">GPS + Geofencing</text>
    
    <!-- Visual icon / diagram -->
    <circle cx="110" cy="95" r="38" fill="#FBF9FD" stroke="#7C5CE8" stroke-dasharray="4,4" stroke-width="2"/>
    <circle cx="110" cy="95" r="8" fill="#7C5CE8"/>
    <text x="110" y="150" font-size="11" font-weight="600" fill="#7C5CE8" text-anchor="middle">Radius Valid: 50m</text>
    
    <text x="18" y="180" font-size="12" font-weight="600" fill="#172B4D">• Fleksibilitas Tinggi</text>
    <text x="18" y="202" font-size="12" fill="#5E6C84">• Penjualan, kurir, proyek</text>
    <text x="18" y="224" font-size="12" fill="#5E6C84">• Anti Fake GPS mock</text>
    <text x="18" y="246" font-size="12" fill="#00875A" font-weight="600">✓ Tanpa perangkat fisik</text>
  </g>

  <!-- Card 2: Pengenalan Wajah -->
  <g transform="translate(290, 105)">
    <rect width="220" height="275" rx="10" fill="#FFFFFF" stroke="#ECE4F7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="220" height="42" rx="10" fill="#F4F0FD"/>
    <circle cx="28" cy="21" r="10" fill="#7C5CE8"/>
    <text x="25" y="25" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
    <text x="48" y="26" font-size="13" font-weight="700" fill="#091E42">AI Face Recognition</text>
    
    <!-- Face scan visual -->
    <rect x="75" y="65" width="70" height="65" rx="8" fill="#FBF9FD" stroke="#7C5CE8" stroke-width="1.5"/>
    <circle cx="95" cy="90" r="4" fill="#7C5CE8"/>
    <circle cx="125" cy="90" r="4" fill="#7C5CE8"/>
    <path d="M 98 112 Q 110 120 122 112" fill="none" stroke="#7C5CE8" stroke-width="2"/>
    <text x="110" y="150" font-size="11" font-weight="600" fill="#7C5CE8" text-anchor="middle">Liveness Detection</text>

    <text x="18" y="180" font-size="12" font-weight="600" fill="#172B4D">• Bukti Identitas Nyata</text>
    <text x="18" y="202" font-size="12" fill="#5E6C84">• Mencegah titip absen</text>
    <text x="18" y="224" font-size="12" fill="#5E6C84">• Deteksi kedipan/gerak</text>
    <text x="18" y="246" font-size="12" fill="#00875A" font-weight="600">✓ Kamera smartphone</text>
  </g>

  <!-- Card 3: Fingerprint Fisik -->
  <g transform="translate(540, 105)">
    <rect width="220" height="275" rx="10" fill="#FFFFFF" stroke="#ECE4F7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="220" height="42" rx="10" fill="#F4F0FD"/>
    <circle cx="28" cy="21" r="10" fill="#7C5CE8"/>
    <text x="25" y="25" font-size="11" font-weight="800" fill="#FFFFFF">3</text>
    <text x="48" y="26" font-size="13" font-weight="700" fill="#091E42">Fingerprint Fisik</text>
    
    <!-- Fingerprint visual -->
    <rect x="80" y="65" width="60" height="65" rx="12" fill="#FBF9FD" stroke="#7C5CE8" stroke-width="1.5"/>
    <path d="M 100 85 Q 110 75 120 85 Q 125 100 115 115 Q 110 120 105 115" fill="none" stroke="#7C5CE8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105 92 Q 110 87 115 92 Q 118 100 112 108" fill="none" stroke="#7C5CE8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="110" y="150" font-size="11" font-weight="600" fill="#7C5CE8" text-anchor="middle">Stasiun Pos Tetap</text>

    <text x="18" y="180" font-size="12" font-weight="600" fill="#172B4D">• Kehadiran Titik Tunggal</text>
    <text x="18" y="202" font-size="12" fill="#5E6C84">• Kantor cabang &amp; pabrik</text>
    <text x="18" y="224" font-size="12" fill="#DE350B">• Kendala jari kotor/basah</text>
    <text x="18" y="246" font-size="12" fill="#5E6C84">• Mesin fisik di dinding</text>
  </g>
</svg>
