<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Fleet Management Logistik dan Tambang di Kalimantan Timur</title>
  <desc>Ilustrasi visual sistem monitoring armada truk operasional dan alat berat secara real-time di area pertambangan dan logistik Kaltim.</desc>
  <rect width="100%_fix" width="800" height="400" fill="#F8FAFC" rx="12"/>
  <!-- Decorative background elements -->
  <path d="M0 300 Q 200 250, 400 300 T 800 280 L 800 400 L 0 400 Z" fill="#E2E8F0" opacity="0.5"/>
  <path d="M0 340 Q 300 300, 600 350 T 800 330 L 800 400 L 0 400 Z" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Central card container -->
  <rect x="60" y="50" width="680" height="300" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="60" y="50" width="680" height="60" rx="8" fill="#172B4D"/>
  <circle cx="90" cy="80" r="6" fill="#46B6E9"/>
  <circle cx="110" cy="80" r="6" fill="#7C5CE8"/>
  <text x="135" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Altora Fleet Intelligence - Live Telemetry</text>
  
  <!-- Map / Grid representation -->
  <line x1="100" y1="150" x2="700" y2="150" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="100" y1="210" x2="700" y2="210" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="100" y1="270" x2="700" y2="270" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>
  
  <line x1="220" y1="120" x2="220" y2="320" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="420" y1="120" x2="420" y2="320" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="120" x2="600" y2="320" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Truck Node 1 -->
  <g transform="translate(180, 170)">
    <circle cx="0" cy="0" r="22" fill="#7C5CE8" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#7C5CE8"/>
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">T1</text>
    <rect x="-35" y="18" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="0" y="32" fill="#172B4D" font-family="sans-serif" font-size="10" text-anchor="middle">Hauling 42t</text>
  </g>

  <!-- Truck Node 2 -->
  <g transform="translate(480, 200)">
    <circle cx="0" cy="0" r="22" fill="#46B6E9" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#46B6E9"/>
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">T2</text>
    <rect x="-35" y="18" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="0" y="32" fill="#172B4D" font-family="sans-serif" font-size="10" text-anchor="middle">Fuel 94%</text>
  </g>

  <!-- Excavator Node -->
  <g transform="translate(320, 250)">
    <circle cx="0" cy="0" r="22" fill="#10B981" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#10B981"/>
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">EX</text>
    <rect x="-35" y="18" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="0" y="32" fill="#172B4D" font-family="sans-serif" font-size="10" text-anchor="middle">Active Op</text>
  </g>

  <!-- Status / Stats panel on right inside card -->
  <rect x="610" y="130" width="110" height="180" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="665" y="155" fill="#172B4D" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FLEET STATS</text>
  <line x1="620" y1="165" x2="710" y2="165" stroke="#E2E8F0"/>
  
  <text x="620" y="190" fill="#64748B" font-family="sans-serif" font-size="10">Units Online:</text>
  <text x="700" y="190" fill="#172B4D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">28 / 30</text>

  <text x="620" y="220" fill="#64748B" font-family="sans-serif" font-size="10">Geo-Fence:</text>
  <text x="700" y="220" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">SECURE</text>

  <text x="620" y="250" fill="#64748B" font-family="sans-serif" font-size="10">Fuel Alert:</text>
  <text x="700" y="250" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">1 Unit</text>

  <text x="620" y="280" fill="#64748B" font-family="sans-serif" font-size="10">Speed Avg:</text>
  <text x="700" y="280" fill="#172B4D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">42 km/h</text>
</svg>
