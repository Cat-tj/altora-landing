<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <title>Perbandingan Operasional Armada: Manual vs Altora FMS</title>
  <desc>Tabel perbandingan visual antara pencatatan manual via radio/WhatsApp dengan sistem Fleet Management Service (FMS) terintegrasi.</desc>
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>

  <text x="400" y="45" fill="#172B4D" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Transformasi Pengelolaan Armada Kaltim</text>

  <!-- Left Column: Manual / WhatsApp -->
  <g transform="translate(60, 70)">
    <rect width="320" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="320" height="40" rx="8" fill="#EF4444" opacity="0.1"/>
    <text x="160" y="25" fill="#B91C1C" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Metode Konvensional (Manual)</text>
    
    <g transform="translate(20, 60)">
      <circle cx="10" cy="10" r="6" fill="#EF4444" opacity="0.3"/>
      <text x="30" y="14" fill="#172B4D" font-family="sans-serif" font-size="12">Laporan posisi via radio HT/WhatsApp berkala</text>
      
      <circle cx="10" cy="50" r="6" fill="#EF4444" opacity="0.3"/>
      <text x="30" y="54" fill="#172B4D" font-family="sans-serif" font-size="12">Audit bahan bakar manual dan rawan selisih</text>
      
      <circle cx="10" cy="90" r="6" fill="#EF4444" opacity="0.3"/>
      <text x="30" y="94" fill="#172B4D" font-family="sans-serif" font-size="12">Keterlambatan respons saat terjadi darurat</text>
      
      <circle cx="10" cy="130" r="6" fill="#EF4444" opacity="0.3"/>
      <text x="30" y="134" fill="#172B4D" font-family="sans-serif" font-size="12">Rekap pemeliharaan mesin sering terlewat</text>
    </g>
  </g>

  <!-- Right Column: Altora FMS -->
  <g transform="translate(420, 70)">
    <rect width="320" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="320" height="40" rx="8" fill="#10B981" opacity="0.1"/>
    <text x="160" y="25" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Altora Fleet Management (FMS)</text>
    
    <g transform="translate(20, 60)">
      <circle cx="10" cy="10" r="6" fill="#10B981"/>
      <text x="30" y="14" fill="#172B4D" font-family="sans-serif" font-size="12">Pelacakan posisi real-time via GPS &amp; Peta</text>
      
      <circle cx="10" cy="50" r="6" fill="#10B981"/>
      <text x="30" y="54" fill="#172B4D" font-family="sans-serif" font-size="12">Sensor bahan bakar otomatis &amp; anti pencurian</text>
      
      <circle cx="10" cy="90" r="6" fill="#10B981"/>
      <text x="30" y="94" fill="#172B4D" font-family="sans-serif" font-size="12">Geofencing &amp; peringatan pelanggaran jalur</text>
      
      <circle cx="10" cy="130" r="6" fill="#10B981"/>
      <text x="30" y="134" fill="#172B4D" font-family="sans-serif" font-size="12">Jadwal servis preventif berbasis jam kerja</text>
    </g>
  </g>

</svg>
