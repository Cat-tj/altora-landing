<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <title>Alur Telemetri dan Pemantauan Armada Real-Time</title>
  <desc>Diagram alur dari unit kendaraan GPS di lapangan hingga dashboard pusat pemantauan operasional tambang.</desc>
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>

  <text x="400" y="45" fill="#172B4D" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Arsitektur Data Fleet Management Altora</text>

  <!-- Step 1: Field Unit -->
  <g transform="translate(60, 90)">
    <rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="180" height="40" rx="8" fill="#7C5CE8"/>
    <text x="90" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Unit Lapangan</text>
    <circle cx="90" cy="80" r="18" fill="#7C5CE8" opacity="0.15"/>
    <text x="90" y="84" fill="#7C5CE8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GPS/IoT</text>
    <text x="90" y="125" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Sensor Bahan Bakar</text>
    <text x="90" y="145" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• GPS &amp; Gyroscope</text>
    <text x="90" y="165" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Diagnostik Mesin</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(255, 180)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="45,-5 55,0 45,5" fill="#CBD5E1"/>
  </g>

  <!-- Step 2: Cloud / Transmission -->
  <g transform="translate(310, 90)">
    <rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="180" height="40" rx="8" fill="#46B6E9"/>
    <text x="90" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Transmisi Data</text>
    <circle cx="90" cy="80" r="18" fill="#46B6E9" opacity="0.15"/>
    <text x="90" y="84" fill="#46B6E9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Gateway</text>
    <text x="90" y="125" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Seluler 4G / Satelit</text>
    <text x="90" y="145" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Enkripsi TLS</text>
    <text x="90" y="165" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Buffering Offline</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(505, 180)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="45,-5 55,0 45,5" fill="#CBD5E1"/>
  </g>

  <!-- Step 3: Command Center -->
  <g transform="translate(560, 90)">
    <rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="180" height="40" rx="8" fill="#172B4D"/>
    <text x="90" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Command Center</text>
    <circle cx="90" cy="80" r="18" fill="#172B4D" opacity="0.15"/>
    <text x="90" y="84" fill="#172B4D" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Dashboard</text>
    <text x="90" y="125" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Peta Real-Time</text>
    <text x="90" y="145" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Peringatan Dini</text>
    <text x="90" y="165" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">• Laporan Otomatis</text>
  </g>

</svg>
