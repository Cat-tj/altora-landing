<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Perbandingan Metode Konvensional vs Smart Farming Sensor</title>
  <desc>Tabel komparasi antara pengecekan manual dan pemantauan sensor tanah otomatis.</desc>
  <rect width="800" height="450" fill="#F8F9FA" rx="12" />
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="2" />
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#172B4D">Komparasi Metode Pengelolaan Lahan</text>
  <text x="80" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#4A5568">Perbedaan mendasar antara inspeksi konvensional dan sistem sensor IoT.</text>
  <!-- Header Row -->
  <rect x="80" y="150" width="320" height="40" fill="#F1F5F9" />
  <rect x="400" y="150" width="320" height="40" fill="#E6F6FD" />
  <text x="240" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4A5568" text-anchor="middle">Metode Konvensional</text>
  <text x="560" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0284C7" text-anchor="middle">Smart Farming IoT</text>
  <!-- Row 1 -->
  <rect x="80" y="190" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <rect x="400" y="190" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="240" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">Pengecekan visual / cangkul manual</text>
  <text x="560" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Pembacaan real-time 24/7 via sensor</text>
  <!-- Row 2 -->
  <rect x="80" y="250" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <rect x="400" y="250" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="240" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">Risiko keterlambatan penyiraman</text>
  <text x="560" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Peringatan otomatis saat tanah kering</text>
  <!-- Row 3 -->
  <rect x="80" y="310" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <rect x="400" y="310" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="240" y="345" font-family="system-ui, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">Penggunaan air &amp; pupuk berlebih</text>
  <text x="560" y="345" font-family="system-ui, sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Efisiensi input berdasarkan data</text>
</svg>