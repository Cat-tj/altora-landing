<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Smart Farming Sensor Kelembapan Tanah di Kaltim</title>
  <desc>Ilustrasi sistem pemantauan kelembapan tanah berbasis IoT untuk pertanian modern di Kalimantan Timur.</desc>
  <rect width="800" height="450" fill="#F8F9FA" rx="12" />
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="2" />
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#172B4D">Arsitektur Smart Farming Kaltim</text>
  <text x="80" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#4A5568">Integrasi sensor tanah nirkabel, gateway LoRa/GSM, dan dashboard pemantauan real-time.</text>
  <!-- Node 1 -->
  <rect x="80" y="180" width="160" height="140" rx="6" fill="#F0EDFF" stroke="#7C5CE8" stroke-width="1.5" />
  <text x="160" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7C5CE8" text-anchor="middle">Sensor Tanah</text>
  <text x="160" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Kadar Air &amp; pH</text>
  <text x="160" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Suhu Lahan</text>
  <!-- Arrow 1 -->
  <line x1="240" y1="250" x2="320" y2="250" stroke="#CBD5E0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Node 2 -->
  <rect x="320" y="180" width="160" height="140" rx="6" fill="#E6F6FD" stroke="#46B6E9" stroke-width="1.5" />
  <text x="400" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0284C7" text-anchor="middle">Gateway IoT</text>
  <text x="400" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Transmisi Sinyal</text>
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Cloud Sync</text>
  <!-- Arrow 2 -->
  <line x1="480" y1="250" x2="560" y2="250" stroke="#CBD5E0" stroke-width="2" />
  <!-- Node 3 -->
  <rect x="560" y="180" width="160" height="140" rx="6" fill="#F0EDFF" stroke="#7C5CE8" stroke-width="1.5" />
  <text x="640" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7C5CE8" text-anchor="middle">Dashboard</text>
  <text x="640" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Monitoring HP</text>
  <text x="640" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Notifikasi Dini</text>
</svg>