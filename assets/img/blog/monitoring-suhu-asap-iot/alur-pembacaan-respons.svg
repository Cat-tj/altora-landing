<svg width="1200" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">Alur pembacaan sensor ke respons tim</title><desc id="desc">Empat tahap: sensor membaca kondisi, data masuk ke sistem, notifikasi dikirim, lalu petugas memverifikasi dan bertindak.</desc><rect width="1200" height="450" fill="#FFFDF8"/><text x="70" y="75" font-family="sans-serif" font-size="30" font-weight="700" fill="#172B4D">Dari pembacaan ke respons</text><path d="M250 245h100m130 0h100m130 0h100" stroke="#7C5CE8" stroke-width="7" stroke-dasharray="12 10"/><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="145" width="180" height="200" rx="22" fill="#E8F7FD"/><circle cx="160" cy="205" r="35" fill="#46B6E9"/><text x="160" y="285" font-size="18" font-weight="700" fill="#172B4D">1. Sensor membaca</text><text x="160" y="315" font-size="16" fill="#172B4D">suhu atau asap</text><rect x="350" y="145" width="180" height="200" rx="22" fill="#F1EDFF"/><circle cx="440" cy="205" r="35" fill="#7C5CE8"/><text x="440" y="285" font-size="18" font-weight="700" fill="#172B4D">2. Sistem mencatat</text><text x="440" y="315" font-size="16" fill="#172B4D">kondisi dan lokasi</text><rect x="630" y="145" width="180" height="200" rx="22" fill="#FFF0DA"/><circle cx="720" cy="205" r="35" fill="#E6813D"/><text x="720" y="285" font-size="18" font-weight="700" fill="#172B4D">3. Tim diberi tahu</text><text x="720" y="315" font-size="16" fill="#172B4D">sesuai aturan</text><rect x="910" y="145" width="220" height="200" rx="22" fill="#E6F6EC"/><circle cx="1020" cy="205" r="35" fill="#79CBA2"/><text x="1020" y="285" font-size="18" font-weight="700" fill="#172B4D">4. Verifikasi &amp; aksi</text><text x="1020" y="315" font-size="16" fill="#172B4D">cek kondisi nyata</text></g></svg>