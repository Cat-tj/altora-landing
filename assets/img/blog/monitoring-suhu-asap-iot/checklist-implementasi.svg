<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Checklist implementasi monitoring ruang</title><desc id="desc">Empat langkah implementasi: petakan risiko, survei lokasi, uji notifikasi, lalu rawat dan tinjau sistem.</desc><rect width="1200" height="610" fill="#FFFDF8"/><text x="70" y="80" font-family="sans-serif" font-size="30" font-weight="700" fill="#172B4D">Checklist implementasi yang praktis</text><g font-family="sans-serif"><g><circle cx="125" cy="170" r="34" fill="#7C5CE8"/><text x="125" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1</text><text x="190" y="164" font-size="24" font-weight="700" fill="#172B4D">Petakan risiko</text><text x="190" y="196" font-size="18" fill="#172B4D">Ruang, aset, kondisi, dan pemilik tindakan</text></g><path d="M125 220v55" stroke="#CFC5F7" stroke-width="6"/><g><circle cx="125" cy="310" r="34" fill="#46B6E9"/><text x="125" y="320" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2</text><text x="190" y="304" font-size="24" font-weight="700" fill="#172B4D">Survei titik sensor</text><text x="190" y="336" font-size="18" fill="#172B4D">Penempatan, jaringan, daya, dan perlindungan fisik</text></g><path d="M125 360v55" stroke="#BCE8F7" stroke-width="6"/><g><circle cx="125" cy="450" r="34" fill="#E6813D"/><text x="125" y="460" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3</text><text x="190" y="444" font-size="24" font-weight="700" fill="#172B4D">Uji notifikasi bersama tim</text><text x="190" y="476" font-size="18" fill="#172B4D">Pastikan pesan sampai dan tindakan dipahami</text></g><g><rect x="760" y="160" width="340" height="310" rx="24" fill="#F1EDFF"/><text x="805" y="215" font-size="24" font-weight="700" fill="#172B4D">Langkah berulang</text><path d="M815 270l15 15 30-35M815 340l15 15 30-35M815 410l15 15 30-35" fill="none" stroke="#79CBA2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="870" y="280" font-size="19" fill="#172B4D">Periksa perangkat</text><text x="870" y="350" font-size="19" fill="#172B4D">Perbarui penerima</text><text x="870" y="420" font-size="19" fill="#172B4D">Tinjau aturan</text></g></g></svg>