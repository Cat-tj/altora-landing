<svg width="1200" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Peta keputusan notifikasi sensor</title><desc id="desc">Diagram keputusan yang membedakan kondisi normal, peringatan untuk diperiksa, dan kondisi yang perlu eskalasi sesuai prosedur.</desc><rect width="1200" height="560" fill="#FFFDF8"/><text x="70" y="75" font-family="sans-serif" font-size="30" font-weight="700" fill="#172B4D">Notifikasi perlu menghasilkan keputusan</text><rect x="460" y="115" width="280" height="80" rx="18" fill="#E8F7FD" stroke="#46B6E9" stroke-width="4"/><text x="600" y="163" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172B4D">Pembacaan sensor masuk</text><path d="M600 195v55M600 250H285M600 250h315M285 250v45M915 250v45" stroke="#172B4D" stroke-width="4" fill="none"/><rect x="130" y="295" width="310" height="125" rx="18" fill="#E6F6EC"/><text x="285" y="345" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172B4D">Dalam pola normal</text><text x="285" y="380" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172B4D">catat dan pantau</text><rect x="760" y="295" width="310" height="125" rx="18" fill="#FFF0DA"/><text x="915" y="345" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172B4D">Menyimpang</text><text x="915" y="380" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172B4D">kirim pemberitahuan</text><path d="M915 420v45M915 465H600M600 465v35" stroke="#172B4D" stroke-width="4" fill="none"/><rect x="425" y="500" width="350" height="45" rx="15" fill="#F1EDFF"/><text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172B4D">Verifikasi lokasi → tindakan / eskalasi</text></svg>