<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Monitoring suhu dan asap untuk ruang kritis</title><desc id="desc">Ilustrasi ruang server dan gudang dengan sensor suhu dan asap yang mengirim status ke panel pemantauan.</desc><rect width="1200" height="630" fill="#FFFDF8"/><rect x="55" y="70" width="1090" height="490" rx="30" fill="#F1EDFF"/><text x="100" y="135" font-family="sans-serif" font-size="30" font-weight="700" fill="#172B4D">Pantau kondisi ruang sebelum gangguan membesar</text><rect x="110" y="190" width="390" height="290" rx="22" fill="#fff" stroke="#7C5CE8" stroke-width="4"/><text x="150" y="235" font-family="sans-serif" font-size="24" font-weight="700" fill="#172B4D">Ruang server</text><rect x="155" y="270" width="115" height="145" rx="10" fill="#172B4D"/><path d="M180 305h65M180 345h65M180 385h65" stroke="#46B6E9" stroke-width="7"/><circle cx="390" cy="310" r="35" fill="#FFE6C7"/><path d="M390 278v40M370 298h40" stroke="#E6813D" stroke-width="7"/><text x="330" y="375" font-family="sans-serif" font-size="18" fill="#172B4D">sensor suhu</text><rect x="700" y="190" width="390" height="290" rx="22" fill="#fff" stroke="#46B6E9" stroke-width="4"/><text x="740" y="235" font-family="sans-serif" font-size="24" font-weight="700" fill="#172B4D">Gudang</text><path d="M750 405h280V295l-140-70-140 70z" fill="#DFF5EF" stroke="#172B4D" stroke-width="4"/><path d="M860 340c-20-22 12-36 0-58M895 340c-20-22 12-36 0-58" fill="none" stroke="#E6813D" stroke-width="7" stroke-linecap="round"/><circle cx="1050" cy="315" r="28" fill="#FFDDE7"/><text x="905" y="385" font-family="sans-serif" font-size="16" fill="#172B4D">sensor asap</text><path d="M500 335h175" stroke="#7C5CE8" stroke-width="6" stroke-dasharray="10 10"/><path d="M675 335l-18-12v24z" fill="#7C5CE8"/><rect x="535" y="260" width="130" height="145" rx="15" fill="#172B4D"/><text x="557" y="305" font-family="sans-serif" font