<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Peta penentuan zona lahan</title><desc id="desc">Empat faktor yang dipakai untuk memilih zona dan titik sensor.</desc><rect width="1200" height="610" fill="#FFFDF8"/><text x="65" y="85" fill="#172B4D" font-family="sans-serif" font-size="33" font-weight="700">Pilih zona dari kondisi yang memengaruhi keputusan</text><g font-family="sans-serif"><rect x="65" y="145" width="1070" height="350" rx="26" fill="#F1ECFF"/><g fill="#FFFDF8"><rect x="100" y="200" width="220" height="220" rx="20"/><rect x="365" y="200" width="220" height="220" rx="20"/><rect x="630" y="200" width="220" height="220" rx="20"/><rect x="895" y="200" width="200" height="220" rx="20"/></g><g fill="#7C5CE8"><circle cx="210" cy="245" r="18"/><circle cx="475" cy="245" r="18"/><circle cx="740" cy="245" r="18"/><circle cx="995" cy="245" r="18"/></g><g fill="#172B4D" font-size="21" font-weight="700"><text x="130" y="300">Tanaman</text><text x="400" y="300">Drainase</text><text x="675" y="300">Naungan</text><text x="925" y="300">Penyiraman</text></g><g fill="#52627A" font-size="17"><text x="125" y="340">jenis dan fase</text><text x="395" y="340">rendah atau</text><text x="660" y="340">terbuka atau</text><text x="920" y="340">metode dan</text><text x="125" y="365">pertumbuhan</text><text x="395" y="365">cepat mengalir</text><text x="660" y="365">tertutup</text><text x="920" y="365">jadwal kerja</text></g></g><path d="M600 500v42" stroke="#46B6E9" stroke-width="5"/><path d="M588 530l12 12 12-12" stroke="#46B6E9" stroke-width="5" fill="none"/><text x="485" y="580" fill="#172B4D" font-family="sans-serif" font-size="23" font-weight="700">Tentukan titik sensor</text></svg>