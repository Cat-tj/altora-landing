<svg width="1200" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Checklist kesiapan monitoring lahan</title><desc id="desc">Empat langkah kesiapan sebelum monitoring kelembapan tanah dijalankan.</desc><rect width="1200" height="520" fill="#FFFDF8"/><text x="70" y="85" fill="#172B4D" font-family="sans-serif" font-size="33" font-weight="700">Empat fondasi sebelum sistem berjalan</text><g font-family="sans-serif"><path d="M130 180h940" stroke="#46B6E9" stroke-width="8"/><g fill="#7C5CE8"><circle cx="170" cy="180" r="32"/><circle cx="465" cy="180" r="32"/><circle cx="760" cy="180" r="32"/><circle cx="1055" cy="180" r="32"/></g><g fill="#FFFDF8" font-size="23" font-weight="700" text-anchor="middle"><text x="170" y="188">1</text><text x="465" y="188">2</text><text x="760" y="188">3</text><text x="1055" y="188">4</text></g><g fill="#172B4D" font-size="22" font-weight="700"><text x="100" y="275">Petakan zona</text><text x="390" y="275">Siapkan perangkat</text><text x="690" y="275">Atur respons</text><text x="990" y="275">Rawat data</text></g><g fill="#52627A" font-size="17"><text x="100" y="315">kondisi, titik,</text><text x="100" y="340">dan prioritas</text><text x="390" y="315">daya, koneksi,</text><text x="390" y="340">perlindungan</text><text x="690" y="315">penerima dan</text><text x="690" y="340">tindakan</text><text x="990" y="315">cek fisik dan</text><text x="990" y="340">pembacaan</text></g></g></svg>