<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Alur data sensor menjadi tindakan</title><desc id="desc">Lima tahap dari sensor tanah sampai tindakan dan pencatatan.</desc><rect width="1200" height="500" fill="#FFFDF8"/><text x="65" y="80" fill="#172B4D" font-family="sans-serif" font-size="32" font-weight="700">Data harus berujung pada tindakan</text><g font-family="sans-serif" text-anchor="middle"><g fill="#E8F5FC"><rect x="55" y="180" width="175" height="150" rx="22"/><rect x="285" y="180" width="175" height="150" rx="22"/><rect x="515" y="180" width="175" height="150" rx="22"/><rect x="745" y="180" width="175" height="150" rx="22"/><rect x="975" y="180" width="175" height="150" rx="22"/></g><g fill="#172B4D" font-size="20" font-weight="700"><text x="142" y="235">1. Sensor</text><text x="372" y="235">2. Kirim data</text><text x="602" y="235">3. Tinjau</text><text x="832" y="235">4. Periksa</text><text x="1062" y="235">5. Bertindak</text></g><g fill="#52627A" font-size="15"><text x="142" y="275">baca kondisi</text><text x="372" y="275">masuk sistem</text><text x="602" y="275">status zona</text><text x="832" y="275">lapangan</text><text x="1062" y="275">catat hasil</text></g><path d="M235 255h38m-12-12 12 12-12 12M465 255h38m-12-12 12 12-12 12M695 255h38m-12-12 12 12-12 12M925 255h38m-12-12 12 12-12 12" stroke="#7C5CE8" stroke-width="5" fill="none"/></g><text x="65" y="420" fill="#52627A" font-family="sans-serif" font-size="20">Notifikasi dipakai untuk kondisi yang perlu perhatian, bukan setiap pembacaan.</text></svg>