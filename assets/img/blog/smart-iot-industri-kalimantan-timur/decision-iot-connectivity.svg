<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img">
  <title>Pohon Keputusan Pemilihan Jaringan IoT Remote Site</title>
  <desc>Alur logis memilih infrastruktur jaringan telemetri IoT (LoRaWAN, Starlink Satelit, GSM Seluler, atau Kabel PoE Industri) berdasarkan jarak, bandwidth data, dan lokasi geografis di Kalimantan Timur.</desc>
  <rect width="1000" height="480" fill="#FAF7F2" rx="16"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#172B4D">Pohon Keputusan: Memilih Konektivitas IoT di Remote Site</text>
    <text x="500" y="74" text-anchor="middle" font-size="13" fill="#5E6C84">Panduan memilih media transmisi data telemetri agar investasi efisien dan anti putus</text>

    <!-- Root Node -->
    <g transform="translate(380, 105)">
      <rect width="240" height="54" rx="10" fill="#7C5CE8"/>
      <text x="120" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Karakteristik Data &amp; Lokasi</text>
      <text x="120" y="44" text-anchor="middle" font-size="11" fill="#EDE9FB">Berapa volume data &amp; jarak?</text>
    </g>

    <!-- Branches from Root -->
    <path d="M430 159 L250 220" stroke="#7C5CE8" stroke-width="2" fill="none"/>
    <path d="M570 159 L750 220" stroke="#7C5CE8" stroke-width="2" fill="none"/>

    <!-- Left Child: Low Bandwidth / Jarak Jauh -->
    <g transform="translate(130, 220)">
      <rect width="240" height="50" rx="8" fill="#EDE9FB" stroke="#7C5CE8" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Data Kecil (Numerik / Menit)</text>
      <text x="120" y="38" text-anchor="middle" font-size="11" fill="#5E6C84">Sensor Suhu, Tanah, Level Solar</text>
    </g>

    <!-- Right Child: High Bandwidth / Real-Time Media -->
    <g transform="translate(630, 220)">
      <rect width="240" height="50" rx="8" fill="#EDE9FB" stroke="#7C5CE8" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Data Besar (Video / Real-Time)</text>
      <text x="120" y="38" text-anchor="middle" font-size="11" fill="#5E6C84">AI CCTV, Stream Kontinu, SCADA</text>
    </g>

    <!-- Sub-branches Left -->
    <path d="M200 270 L120 330" stroke="#7C5CE8" stroke-width="2" fill="none"/>
    <path d="M300 270 L380 330" stroke="#7C5CE8" stroke-width="2" fill="none"/>

    <!-- Sub-branches Right -->
    <path d="M700 270 L620 330" stroke="#7C5CE8" stroke-width="2" fill="none"/>
    <path d="M800 270 L880 330" stroke="#7C5CE8" stroke-width="2" fill="none"/>

    <!-- Decision 1: LoRaWAN -->
    <g transform="translate(30, 330)">
      <rect width="180" height="110" rx="10" fill="#FFFFFF" stroke="#48C78E" stroke-width="2"/>
      <rect width="180" height="30" rx="10" fill="#E8F8F0"/>
      <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">LoRaWAN Lokal</text>
      <text x="12" y="50" font-size="11" fill="#172B4D">• Area perkebunan sawit</text>
      <text x="12" y="68" font-size="11" fill="#172B4D">• Radius tembus hingga 15km</text>
      <text x="12" y="86" font-size="11" fill="#172B4D">• Baterai sensor awet 3-5 th</text>
      <text x="12" y="102" font-size="10" font-weight="bold" fill="#48C78E">Bebas Pulsa Bulanan</text>
    </g>

    <!-- Decision 2: 4G/GSM Industrial Router -->
    <g transform="translate(290, 330)">
      <rect width="180" height="110" rx="10" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="180" height="30" rx="10" fill="#F4F5F7"/>
      <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#172B4D">GSM / 4G Industri</text>
      <text x="12" y="50" font-size="11" fill="#172B4D">• Ada sinyal seluler stabil</text>
      <text x="12" y="68" font-size="11" fill="#172B4D">• Dekat jalan poros utama</text>
      <text x="12" y="86" font-size="11" fill="#172B4D">• Modem RTU multi-operator</text>
      <text x="12" y="102" font-size="10" font-weight="bold" fill="#5E6C84">Biaya Awal Murah</text>
    </g>

    <!-- Decision 3: Starlink Enterprise Satelit -->
    <g transform="translate(530, 330)">
      <rect width="180" height="110" rx="10" fill="#FFFFFF" stroke="#7C5CE8" stroke-width="2"/>
      <rect width="180" height="30" rx="10" fill="#EDE9FB"/>
      <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Starlink Enterprise</text>
      <text x="12" y="50" font-size="11" fill="#172B4D">• Pit tambang pedalaman</text>
      <text x="12" y="68" font-size="11" fill="#172B4D">• Bandwidth 100-250 Mbps</text>
      <text x="12" y="86" font-size="11" fill="#172B4D">• Latensi rendah 30-50 ms</text>
      <text x="12" y="102" font-size="10" font-weight="bold" fill="#7C5CE8">Solusi Zero-Cellular Site</text>
    </g>

    <!-- Decision 4: Industrial Fiber & PoE -->
    <g transform="translate(790, 330)">
      <rect width="180" height="110" rx="10" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="180" height="30" rx="10" fill="#F4F5F7"/>
      <text x="90" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#172B4D">Kabel PoE &amp; Fiber</text>
      <text x="12" y="50" font-size="11" fill="#172B4D">• Pabrik PKS / Jetty statis</text>
      <text x="12" y="68" font-size="11" fill="#172B4D">• Anti interferensi cuaca</text>
      <text x="12" y="86" font-size="11" fill="#172B4D">• Daya tahan korosi &amp; getaran</text>
      <text x="12" y="102" font-size="10" font-weight="bold" fill="#5E6C84">Keandalan Fisik Tertinggi</text>
    </g>

  </g>
</svg>
