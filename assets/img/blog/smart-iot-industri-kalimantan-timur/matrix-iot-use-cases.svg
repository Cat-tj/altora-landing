<svg width="1000" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img">
  <title>Matriks Kasus Penggunaan IoT Industri di Sektor Unggulan Kaltim</title>
  <desc>Perbandingan parameter implementasi IoT untuk Pertambangan Batubara, Perkebunan Kelapa Sawit, dan Pergudangan/Logistik Hauling.</desc>
  <rect width="1000" height="480" fill="#FAF7F2" rx="16"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#172B4D">Matriks Implementasi IoT Industri Berdasarkan Sektor Bisnis Kaltim</text>
    <text x="500" y="74" text-anchor="middle" font-size="13" fill="#5E6C84">Tantangan fisik, jenis sensor, protokol jaringan, dan dampak finansial langsung ke operasional</text>

    <!-- Table Header -->
    <g transform="translate(40, 100)">
      <rect width="920" height="44" rx="8" fill="#7C5CE8"/>
      <text x="25" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">Sektor Industri</text>
      <text x="220" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">Tantangan Utama</text>
      <text x="440" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">Teknologi Sensor &amp; Edge</text>
      <text x="680" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">Protokol &amp; Jaringan</text>
      <text x="830" y="27" font-size="13" font-weight="bold" fill="#FFFFFF">Manfaat</text>
    </g>

    <!-- Row 1: Pertambangan Batubara -->
    <g transform="translate(40, 155)">
      <rect width="920" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="15" y="15" width="160" height="28" rx="6" fill="#EDE9FB"/>
      <text x="95" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Pertambangan</text>
      <text x="95" y="62" text-anchor="middle" font-size="11" fill="#5E6C84">Site Remote &amp; Hauling</text>

      <text x="220" y="35" font-size="12" fill="#172B4D">Pencurian bahan bakar solar,</text>
      <text x="220" y="55" font-size="12" fill="#172B4D">kerusakan bearing mendadak,</text>
      <text x="220" y="75" font-size="12" fill="#172B4D">blindspot jalur hauling</text>

      <text x="440" y="35" font-size="12" fill="#172B4D">Sensor ultrasonik fuel storage,</text>
      <text x="440" y="55" font-size="12" fill="#172B4D">akselerometer vibrasi conveyor,</text>
      <text x="440" y="75" font-size="12" fill="#172B4D">AI CCTV area kerja</text>

      <text x="680" y="35" font-size="12" fill="#172B4D">Modbus RS485 ke RTU,</text>
      <text x="680" y="55" font-size="12" fill="#172B4D">Koneksi satelit,</text>
      <text x="680" y="75" font-size="12" fill="#172B4D">MQTT TLS 1.3</text>

      <text x="830" y="35" font-size="12" font-weight="bold" fill="#48C78E">Solar dipantau</text>
      <text x="830" y="55" font-size="12" fill="#172B4D">Deteksi dini</text>
      <text x="830" y="75" font-size="12" fill="#172B4D">kerusakan</text>
    </g>

    <!-- Row 2: Perkebunan Sawit -->
    <g transform="translate(40, 255)">
      <rect width="920" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="15" y="15" width="160" height="28" rx="6" fill="#E8F8F0"/>
      <text x="95" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Perkebunan Sawit</text>
      <text x="95" y="62" text-anchor="middle" font-size="11" fill="#5E6C84">PKS &amp; Ribuan Hektar</text>

      <text x="220" y="35" font-size="12" fill="#172B4D">Luas lahan tanpa seluler,</text>
      <text x="220" y="55" font-size="12" fill="#172B4D">anomali suhu boiler PKS,</text>
      <text x="220" y="75" font-size="12" fill="#172B4D">kadar air tanah &amp; buah</text>

      <text x="440" y="35" font-size="12" fill="#172B4D">Sensor kelembapan tanah,</text>
      <text x="440" y="55" font-size="12" fill="#172B4D">probe termal inframerah sterilizer,</text>
      <text x="440" y="75" font-size="12" fill="#172B4D">flowmeter solar generator PKS</text>

      <text x="680" y="35" font-size="12" fill="#172B4D">LoRaWAN 920-923 MHz,</text>
      <text x="680" y="55" font-size="12" fill="#172B4D">Gateway tower terpusat,</text>
      <text x="680" y="75" font-size="12" fill="#172B4D">Backbone fiber / satelit</text>

      <text x="830" y="35" font-size="12" font-weight="bold" fill="#48C78E">Irigasi terarah</text>
      <text x="830" y="55" font-size="12" fill="#172B4D">Suhu PKS</text>
      <text x="830" y="75" font-size="12" fill="#172B4D">terpantau</text>
    </g>

    <!-- Row 3: Logistik &amp; Pergudangan Pelabuhan -->
    <g transform="translate(40, 355)">
      <rect width="920" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="15" y="15" width="160" height="28" rx="6" fill="#FFF4E5"/>
      <text x="95" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Logistik &amp; Maritim</text>
      <text x="95" y="62" text-anchor="middle" font-size="11" fill="#5E6C84">Gudang &amp; Jetty Sungai</text>

      <text x="220" y="35" font-size="12" fill="#172B4D">Selisih muatan tongkang,</text>
      <text x="220" y="55" font-size="12" fill="#172B4D">titik panas kargo batubara,</text>
      <text x="220" y="75" font-size="12" fill="#172B4D">pelanggaran APD dermaga</text>

      <text x="440" y="35" font-size="12" fill="#172B4D">Thermal imaging camera,</text>
      <text x="440" y="55" font-size="12" fill="#172B4D">sensor draft tongkang jetty,</text>
      <text x="440" y="75" font-size="12" fill="#172B4D">sensor asap optik</text>

      <text x="680" y="35" font-size="12" fill="#172B4D">Ethernet PoE industri,</text>
      <text x="680" y="55" font-size="12" fill="#172B4D">Wi-Fi outdoor,</text>
      <text x="680" y="75" font-size="12" fill="#172B4D">API REST ke ERP Altora</text>

      <text x="830" y="35" font-size="12" font-weight="bold" fill="#48C78E">Titik panas</text>
      <text x="830" y="55" font-size="12" fill="#172B4D">Tonase</text>
      <text x="830" y="75" font-size="12" fill="#172B4D">tercatat</text>
    </g>

  </g>
</svg>
