<svg width="1200" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img">
  <title>Arsitektur Sistem IoT Industri Altora di Remote Site Kaltim</title>
  <desc>Diagram komprehensif alur IoT industri: Sensor Edge di site tambang/sawit, Gateway &amp; Edge Processing, Jaringan hybrid satelit/LoRa, Server Altora On-Premise/Cloud, dan Dashboard Analitik Real-Time.</desc>
  <rect width="1200" height="480" fill="#FAF7F2" rx="16"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#172B4D">Arsitektur IoT Industri Terpadu di Site Remote Kalimantan Timur</text>
    <text x="600" y="74" text-anchor="middle" font-size="14" fill="#5E6C84">Integrasi sensor fisik, edge telemetry, transmisi satelit, hingga dasbor monitoring manajerial</text>

    <!-- Pillar 1: Field Devices / Edge Sensors -->
    <g transform="translate(40, 110)">
      <rect width="200" height="320" rx="12" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="200" height="48" rx="12" fill="#E8EEF5"/>
      <circle cx="32" cy="24" r="12" fill="#7C5CE8"/>
      <text x="32" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
      <text x="56" y="29" font-size="14" font-weight="bold" fill="#172B4D">Sensor Lapangan</text>
      
      <g transform="translate(15, 65)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">Suhu &amp; Kelembapan</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Gudang &amp; Silo Sawit</text>
      </g>
      <g transform="translate(15, 125)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">Level &amp; Arus Solar</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Tangki Fuel Genset</text>
      </g>
      <g transform="translate(15, 185)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">Vibrasi &amp; Bearing</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Crusher &amp; Conveyor</text>
      </g>
      <g transform="translate(15, 245)">
        <rect width="170" height="55" rx="8" fill="#F4F5F7"/>
        <text x="15" y="22" font-size="12" font-weight="bold" fill="#172B4D">AI CCTV &amp; APD</text>
        <text x="15" y="38" font-size="11" fill="#5E6C84">Deteksi Helm/Rompi K3</text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M248 270 L270 270" stroke="#7C5CE8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="274,270 264,264 264,276" fill="#7C5CE8"/>

    <!-- Pillar 2: Edge Computing &amp; RTU -->
    <g transform="translate(278, 110)">
      <rect width="200" height="320" rx="12" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="200" height="48" rx="12" fill="#E8EEF5"/>
      <circle cx="32" cy="24" r="12" fill="#7C5CE8"/>
      <text x="32" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
      <text x="56" y="29" font-size="14" font-weight="bold" fill="#172B4D">Edge Gateway</text>
      
      <g transform="translate(15, 65)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Protokol Industri</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Modbus RS485 / 4-20mA</text>
      </g>
      <g transform="translate(15, 125)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Local Storage</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Store-and-Forward Cache</text>
      </g>
      <g transform="translate(15, 185)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Threshold Alerting</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Siren Lokal Siaga Bahaya</text>
      </g>
      <g transform="translate(15, 245)">
        <rect width="170" height="55" rx="8" fill="#EDE9FB"/>
        <text x="15" y="22" font-size="12" font-weight="bold" fill="#7C5CE8">Data Sanitization</text>
        <text x="15" y="38" font-size="11" fill="#5E6C84">Filtering Noise &amp; Anomali</text>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M486 270 L508 270" stroke="#7C5CE8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="512,270 502,264 502,276" fill="#7C5CE8"/>

    <!-- Pillar 3: Telemetri &amp; Konektivitas -->
    <g transform="translate(516, 110)">
      <rect width="200" height="320" rx="12" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="200" height="48" rx="12" fill="#E8EEF5"/>
      <circle cx="32" cy="24" r="12" fill="#7C5CE8"/>
      <text x="32" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
      <text x="56" y="29" font-size="14" font-weight="bold" fill="#172B4D">Transmisi Hybrid</text>
      
      <g transform="translate(15, 65)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">Koneksi Satelit</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Satelit LEO</text>
      </g>
      <g transform="translate(15, 125)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">LoRaWAN Long-Range</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Jangkauan Blok Sawit</text>
      </g>
      <g transform="translate(15, 185)">
        <rect width="170" height="50" rx="8" fill="#F4F5F7"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#172B4D">Enkripsi TLS</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">MQTT over TLS Port 8883</text>
      </g>
      <g transform="translate(15, 245)">
        <rect width="170" height="55" rx="8" fill="#F4F5F7"/>
        <text x="15" y="22" font-size="12" font-weight="bold" fill="#172B4D">Failover GSM/Radio</text>
        <text x="15" y="38" font-size="11" fill="#5E6C84">Dual WAN Auto-Switch</text>
      </g>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M724 270 L746 270" stroke="#7C5CE8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="750,270 740,264 740,276" fill="#7C5CE8"/>

    <!-- Pillar 4: Altora Cloud / On-Premise Engine -->
    <g transform="translate(754, 110)">
      <rect width="200" height="320" rx="12" fill="#FFFFFF" stroke="#D3E0EA" stroke-width="2"/>
      <rect width="200" height="48" rx="12" fill="#E8EEF5"/>
      <circle cx="32" cy="24" r="12" fill="#7C5CE8"/>
      <text x="32" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
      <text x="56" y="29" font-size="14" font-weight="bold" fill="#172B4D">Platform Altora</text>
      
      <g transform="translate(15, 65)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Time-Series DB</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Penyimpanan Teroptimasi</text>
      </g>
      <g transform="translate(15, 125)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Integrasi ERP Altora</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Link ke Modul Stok &amp; PO</text>
      </g>
      <g transform="translate(15, 185)">
        <rect width="170" height="50" rx="8" fill="#EDE9FB"/>
        <text x="15" y="25" font-size="12" font-weight="bold" fill="#7C5CE8">Smart Rules Engine</text>
        <text x="15" y="42" font-size="11" fill="#5E6C84">Pemicu Tiket Maintenance</text>
      </g>
      <g transform="translate(15, 245)">
        <rect width="170" height="55" rx="8" fill="#EDE9FB"/>
        <text x="15" y="22" font-size="12" font-weight="bold" fill="#7C5CE8">Security Sandbox</text>
        <text x="15" y="38" font-size="11" fill="#5E6C84">Segmentasi Jaringan OT</text>
      </g>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M962 270 L984 270" stroke="#7C5CE8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="988,270 978,264 978,276" fill="#7C5CE8"/>

    <!-- Pillar 5: Command Center &amp; Operasional -->
    <g transform="translate(992, 110)">
      <rect width="170" height="320" rx="12" fill="#FFFFFF" stroke="#48C78E" stroke-width="2"/>
      <rect width="170" height="48" rx="12" fill="#E8F8F0"/>
      <circle cx="28" cy="24" r="12" fill="#48C78E"/>
      <text x="28" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
      <text x="48" y="29" font-size="13" font-weight="bold" fill="#172B4D">Output Keputusan</text>
      
      <g transform="translate(12, 65)">
        <rect width="146" height="50" rx="8" fill="#F4F5F7"/>
        <text x="10" y="25" font-size="11" font-weight="bold" fill="#172B4D">Command Center</text>
        <text x="10" y="42" font-size="10" fill="#5E6C84">Layar Pantau</text>
      </g>
      <g transform="translate(12, 125)">
        <rect width="146" height="50" rx="8" fill="#F4F5F7"/>
        <text x="10" y="25" font-size="11" font-weight="bold" fill="#172B4D">Aplikasi Mobile</text>
        <text x="10" y="42" font-size="10" fill="#5E6C84">Mandor Lapangan</text>
      </g>
      <g transform="translate(12, 185)">
        <rect width="146" height="50" rx="8" fill="#F4F5F7"/>
        <text x="10" y="25" font-size="11" font-weight="bold" fill="#172B4D">WhatsApp Alert</text>
        <text x="10" y="42" font-size="10" fill="#5E6C84">Notifikasi Insiden</text>
      </g>
      <g transform="translate(12, 245)">
        <rect width="146" height="55" rx="8" fill="#F4F5F7"/>
        <text x="10" y="22" font-size="11" font-weight="bold" fill="#172B4D">Laporan Otomatis</text>
        <text x="10" y="38" font-size="10" fill="#5E6C84">Laporan berkala</text>
      </g>
    </g>

  </g>
</svg>