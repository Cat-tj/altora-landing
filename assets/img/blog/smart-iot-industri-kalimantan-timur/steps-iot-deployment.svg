<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img">
  <title>4 Tahapan Implementasi IoT Industri Turnkey Altora</title>
  <desc>Tahapan implementasi IoT turnkey Altora: Site Survey Fisik, Desain Edge &amp; Perangkat Keras, Uji Stabilitas Toko/PoC, hingga Integrasi Command Center ERP.</desc>
  <rect width="1000" height="480" fill="#FAF7F2" rx="16"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#172B4D">4 Langkah Penerapan IoT Industri Turnkey di Operasional Lapangan</text>
    <text x="500" y="74" text-anchor="middle" font-size="13" fill="#5E6C84">Metodologi teruji Altora dari audit medan hingga penyatuan data dengan sistem bisnis</text>

    <!-- Connecting Baseline -->
    <path d="M125 180 L875 180" stroke="#D3E0EA" stroke-width="4" stroke-dasharray="8 8"/>

    <!-- Step 1 -->
    <g transform="translate(60, 130)">
      <circle cx="65" cy="50" r="30" fill="#7C5CE8"/>
      <text x="65" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
      
      <rect x="0" y="100" width="130" height="210" rx="10" fill="#FFFFFF" stroke="#EDE9FB" stroke-width="2"/>
      <rect x="0" y="100" width="130" height="32" rx="10" fill="#EDE9FB"/>
      <text x="65" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Audit &amp; Survey</text>
      
      <text x="12" y="152" font-size="11" fill="#172B4D">• Survey topografi</text>
      <text x="12" y="172" font-size="11" fill="#172B4D">• Spektrum sinyal RF</text>
      <text x="12" y="192" font-size="11" fill="#172B4D">• Sumber catu daya</text>
      <text x="12" y="212" font-size="11" fill="#172B4D">• Titik kritis mesin</text>
      <text x="12" y="240" font-size="10" font-weight="bold" fill="#5E6C84">Target: Blueprint Site</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(310, 130)">
      <circle cx="65" cy="50" r="30" fill="#7C5CE8"/>
      <text x="65" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
      
      <rect x="0" y="100" width="130" height="210" rx="10" fill="#FFFFFF" stroke="#EDE9FB" stroke-width="2"/>
      <rect x="0" y="100" width="130" height="32" rx="10" fill="#EDE9FB"/>
      <text x="65" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Hardware &amp; Edge</text>
      
      <text x="12" y="152" font-size="11" fill="#172B4D">• Enclosure IP66/67</text>
      <text x="12" y="172" font-size="11" fill="#172B4D">• RTU &amp; Solar panel</text>
      <text x="12" y="192" font-size="11" fill="#172B4D">• Kalibrasi sensor</text>
      <text x="12" y="212" font-size="11" fill="#172B4D">• Fallback local buffer</text>
      <text x="12" y="240" font-size="10" font-weight="bold" fill="#5E6C84">Target: Zero Loss Data</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(560, 130)">
      <circle cx="65" cy="50" r="30" fill="#7C5CE8"/>
      <text x="65" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
      
      <rect x="0" y="100" width="130" height="210" rx="10" fill="#FFFFFF" stroke="#EDE9FB" stroke-width="2"/>
      <rect x="0" y="100" width="130" height="32" rx="10" fill="#EDE9FB"/>
      <text x="65" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C5CE8">Jaringan &amp; Sandboxing</text>
      
      <text x="12" y="152" font-size="11" fill="#172B4D">• Instalasi Starlink</text>
      <text x="12" y="172" font-size="11" fill="#172B4D">• Enkripsi TLS 1.3</text>
      <text x="12" y="192" font-size="11" fill="#172B4D">• Isolasi VLAN OT</text>
      <text x="12" y="212" font-size="11" fill="#172B4D">• NIST SP 800-82 audit</text>
      <text x="12" y="240" font-size="10" font-weight="bold" fill="#5E6C84">Target: Cyber Safe</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(810, 130)">
      <circle cx="65" cy="50" r="30" fill="#48C78E"/>
      <text x="65" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
      
      <rect x="0" y="100" width="130" height="210" rx="10" fill="#FFFFFF" stroke="#E8F8F0" stroke-width="2"/>
      <rect x="0" y="100" width="130" height="32" rx="10" fill="#E8F8F0"/>
      <text x="65" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Integrasi ERP</text>
      
      <text x="12" y="152" font-size="11" fill="#172B4D">• Layar Command Center</text>
      <text x="12" y="172" font-size="11" fill="#172B4D">• Bot WhatsApp alert</text>
      <text x="12" y="192" font-size="11" fill="#172B4D">• Pemicu auto-PO part</text>
      <text x="12" y="212" font-size="11" fill="#172B4D">• Training kru lapangan</text>
      <text x="12" y="240" font-size="10" font-weight="bold" fill="#48C78E">Target: Full Control</text>
    </g>

  </g>
</svg>
