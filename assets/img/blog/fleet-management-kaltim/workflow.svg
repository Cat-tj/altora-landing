<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <title>Alur Sinkronisasi Data Blind Spot</title>
  <desc>Diagram alur store-and-forward untuk penanganan area tanpa sinyal seluler di pedalaman Kaltim.</desc>
  <rect width="1200" height="500" fill="#F8FAFC"/>
  <text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#172B4D" text-anchor="middle">Alur Sinkronisasi Data di Area Blank Spot</text>
  
  <rect x="80" y="140" width="300" height="240" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="230" cy="190" r="22" fill="#7C5CE8" opacity="0.15"/>
  <text x="230" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#7C5CE8" text-anchor="middle">1</text>
  <text x="230" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#172B4D" text-anchor="middle">Perekaman Lokal</text>
  <text x="110" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">Unit masuk area tanpa sinyal.</text>
  <text x="110" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">Data GPS &amp; mesin disimpan</text>
  <text x="110" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">di memori internal kabin.</text>

  <rect x="450" y="140" width="300" height="240" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="600" cy="190" r="22" fill="#46B6E9" opacity="0.15"/>
  <text x="600" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#46B6E9" text-anchor="middle">2</text>
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#172B4D" text-anchor="middle">Store &amp; Forward</text>
  <text x="480" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">Unit kembali menjangkau</text>
  <text x="480" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">jaringan seluler / satelit</text>
  <text x="480" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">secara otomatis.</text>

  <rect x="820" y="140" width="300" height="240" rx="12" fill="#172B4D"/>
  <circle cx="970" cy="190" r="22" fill="#34D399" opacity="0.2"/>
  <text x="970" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#34D399" text-anchor="middle">3</text>
  <text x="970" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sinkronisasi Pusat</text>
  <text x="850" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">Data historis terkirim</text>
  <text x="850" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">utuh ke server pusat tanpa</text>
  <text x="850" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">ada celah informasi.</text>
</svg>
