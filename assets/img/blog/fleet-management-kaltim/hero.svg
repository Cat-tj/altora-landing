<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <title>Fleet Management Kaltim Hero</title>
  <desc>Ilustrasi sistem pemantauan armada truk tambang dan logistik di Kalimantan Timur dengan peta digital dan telematika.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="url(#card)" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="120" cy="120" r="24" fill="#7C5CE8" opacity="0.1"/>
  <text x="120" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#7C5CE8" text-anchor="middle">FMS</text>
  <text x="170" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#172B4D">Fleet Management System - Kaltim Operations</text>
  <rect x="120" y="180" width="300" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="150" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#172B4D">Parameter Utama</text>
  <text x="150" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">• Konsumsi BBM &amp; Idling</text>
  <text x="150" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">• Diagnostik Mesin OBD</text>
  <text x="150" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">• Perilaku Pengemudi</text>
  <text x="150" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">• Geofencing Koridor</text>
  <rect x="460" y="180" width="620" height="330" rx="12" fill="#172B4D"/>
  <text x="510" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Visibilitas Real-Time Lintasan Ekstrem</text>
  <text x="510" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">Pemantauan unit truk pengangkut batubara &amp; logistik lintas kabupaten</text>
  <rect x="510" y="330" width="520" height="130" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="560" cy="395" r="16" fill="#46B6E9" opacity="0.2"/>
  <circle cx="560" cy="395" r="8" fill="#46B6E9"/>
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Unit #04 - Hauling Route A</text>
  <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#34D399">Status: Normal | BBM: 78% | Speed: 42 km/h</text>
</svg>
