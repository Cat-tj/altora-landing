<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Alur Transaksi &amp; Perubahan Stok Otomatis</title>
  <desc>Diagram alur kerja dari pemindaian barcode hingga pembaruan inventaris dan laporan pusat.</desc>
  <style>
    .bg { fill: #F8F9FA; }
    .box { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 2; rx: 6; }
    .highlight { fill: #EBF8FF; stroke: #46B6E9; stroke-width: 2; rx: 6; }
    .txt-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #172B4D; }
    .txt-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4A5568; }
    .line { stroke: #7C5CE8; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="800" height="450" class="bg"/>

  <!-- Step 1 -->
  <rect x="50" y="175" width="180" height="100" class="box"/>
  <text x="70" y="210" class="txt-title">1. Scan Barcode</text>
  <text x="70" y="235" class="txt-desc">Kasir memindai produk</text>
  <text x="70" y="250" class="txt-desc">di meja kasir kilat.</text>

  <path d="M 230 225 L 280 225" class="line"/>
  <polygon points="275,220 285,225 275,230" fill="#7C5CE8"/>

  <!-- Step 2 -->
  <rect x="280" y="175" width="180" height="100" class="highlight"/>
  <text x="300" y="210" class="txt-title">2. Kalkulasi POS</text>
  <text x="300" y="235" class="txt-desc">Harga, diskon, &amp; pajak</text>
  <text x="300" y="250" class="txt-desc">dihitung otomatis.</text>

  <path d="M 460 225 L 510 225" class="line"/>
  <polygon points="505,220 515,225 505,230" fill="#7C5CE8"/>

  <!-- Step 3 -->
  <rect x="510" y="175" width="240" height="100" class="box"/>
  <text x="530" y="210" class="txt-title">3. Potong Stok &amp; Dashboard</text>
  <text x="530" y="235" class="txt-desc">Inventaris gudang berkurang</text>
  <text x="530" y="250" class="txt-desc">&amp; laporan pusat terupdate.</text>
</svg>