<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Matriks Keputusan Migrasi Sistem POS</title>
  <desc>Tabel evaluasi parameter operasional antara metode manual dan digital POS.</desc>
  <style>
    .bg { fill: #F8F9FA; }
    .table-bg { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.5; rx: 6; }
    .header-bg { fill: #172B4D; rx: 6; }
    .header-txt { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .row-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #2D3748; }
    .grid-line { stroke: #E2E8F0; stroke-width: 1; }
  </style>
  <rect width="800" height="450" class="bg"/>
  
  <rect x="50" y="50" width="700" height="350" class="table-bg"/>
  <rect x="50" y="50" width="700" height="50" class="header-bg"/>
  <text x="80" y="82" class="header-txt">Parameter Evaluasi</text>
  <text x="340" y="82" class="header-txt">Pendekatan Manual (Buku)</text>
  <text x="560" y="82" class="header-txt">Sistem POS Digital</text>

  <!-- Rows -->
  <line x1="50" y1="120" x2="750" y2="120" class="grid-line"/>
  <text x="80" y="145" class="row-txt">Kecepatan Transaksi</text>
  <text x="340" y="145" class="row-txt">Lambat (Tulis &amp; Hitung Manual)</text>
  <text x="560" y="145" class="row-txt" style="font-weight: 600; fill: #22543D;">Cepat (Scan Barcode &amp; Auto)</text>

  <line x1="50" y1="180" x2="750" y2="180" class="grid-line"/>
  <text x="80" y="205" class="row-txt">Akurasi Stok Gudang</text>
  <text x="340" y="205" class="row-txt">Sering Meleset &amp; Audit Lama</text>
  <text x="560" y="205" class="row-txt" style="font-weight: 600; fill: #22543D;">Presisi Real-Time per Item</text>

  <line x1="50" y1="240" x2="750" y2="240" class="grid-line"/>
  <text x="80" y="265" class="row-txt">Rekonsiliasi Kas</text>
  <text x="340" y="265" class="row-txt">Rawan Selisih &amp; Susah Lacak</text>
  <text x="560" y="265" class="row-txt" style="font-weight: 600; fill: #22543D;">Otomatis per Shift Kasir</text>

  <line x1="50" y1="300" x2="750" y2="300" class="grid-line"/>
  <text x="80" y="325" class="row-txt">Pengawasan Cabang</text>
  <text x="340" y="325" class="row-txt">Laporan Fisik Terlambat</text>
  <text x="560" y="325" class="row-txt" style="font-weight: 600; fill: #22543D;">Dashboard Cloud Terpusat</text>

  <line x1="50" y1="360" x2="750" y2="360" class="grid-line"/>
  <text x="80" y="385" class="row-txt">Pengambilan Keputusan</text>
  <text x="340" y="385" class="row-txt">Reaktif &amp; Berdasarkan Asumsi</text>
  <text x="560" y="385" class="row-txt" style="font-weight: 600; fill: #22543D;">Proaktif Berbasis Data Valid</text>
</svg>