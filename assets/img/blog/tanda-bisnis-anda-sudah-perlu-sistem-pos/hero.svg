<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Evolusi Operasional Bisnis: Manual vs Sistem POS</title>
  <desc>Diagram perbandingan antara pencatatan buku kas manual dan sistem POS digital terintegrasi.</desc>
  <style>
    .bg { fill: #F8F9FA; }
    .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
    .header { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #172B4D; }
    .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4A5568; }
    .badge-red { fill: #FFF5F5; stroke: #FEB2B2; }
    .badge-green { fill: #F0FFF4; stroke: #9AE6B4; }
    .txt-red { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #C53030; }
    .txt-green { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #22543D; }
    .arrow { stroke: #7C5CE8; stroke-width: 3; fill: none; stroke-dasharray: 6 4; }
  </style>
  <rect width="800" height="450" class="bg"/>
  
  <!-- Manual Side -->
  <rect x="50" y="60" width="310" height="330" class="card"/>
  <rect x="75" y="85" width="260" height="45" rx="6" class="badge-red"/>
  <text x="95" y="112" class="txt-red">METODE KONVENSIONAL (Buku Kas)</text>
  <text x="75" y="155" class="header">Titik Buta Operasional</text>
  <text x="75" y="190" class="sub">• Selisih kas sering lolos tanpa jejak</text>
  <text x="75" y="220" class="sub">• Stok fisik &amp; catatan buku sering selisih</text>
  <text x="75" y="250" class="sub">• Waktu layanan kasir lambat &amp; mengantre</text>
  <text x="75" y="280" class="sub">• Laporan cabang terlambat &amp; manual</text>

  <!-- Arrow -->
  <path d="M 380 225 L 420 225" class="arrow"/>
  <polygon points="415,220 425,225 415,230" fill="#7C5CE8"/>

  <!-- Digital POS Side -->
  <rect x="440" y="60" width="310" height="330" class="card"/>
  <rect x="465" y="85" width="260" height="45" rx="6" class="badge-green"/>
  <text x="485" y="112" class="txt-green">SISTEM POS DIGITAL TERINTEGRASI</text>
  <text x="465" y="155" class="header">Kendali Penuh &amp; Real-Time</text>
  <text x="465" y="190" class="sub">• Rekonsiliasi kas otomatis per shift</text>
  <text x="465" y="220" class="sub">• Inventaris potong stok seketika</text>
  <text x="465" y="250" class="sub">• Transaksi cepat dengan barcode</text>
  <text x="465" y="280" class="sub">• Monitoring multi-cabang dari cloud</text>
</svg>