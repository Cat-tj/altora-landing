<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img">
  <title>Alur keputusan: kapan perlu command center</title>
  <desc>Diagram alur empat langkah untuk menilai kelayakan membangun command center, dari menghitung sumber data hingga evaluasi.</desc>
  <rect width="900" height="560" fill="#FAF7F2"/>
  <g font-family="sans-serif">
    <text x="450" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#172B4D">Kapan Anda Perlu Command Center?</text>
    <g>
      <rect x="120" y="80" width="660" height="76" rx="12" fill="#EDE9FB" stroke="#7C5CE8" stroke-width="2"/>
      <text x="150" y="112" font-size="17" font-weight="bold" fill="#172B4D">1. Hitung sumber data</text>
      <text x="150" y="138" font-size="14" fill="#172B4D">Memantau lebih dari satu jenis? (CCTV + armada + sensor)</text>
    </g>
    <path d="M450 156 L450 186" stroke="#172B4D" stroke-width="3" marker-end="url(#ar)"/>
    <g>
      <rect x="120" y="190" width="660" height="76" rx="12" fill="#E4F2FA" stroke="#46B6E9" stroke-width="2"/>
      <text x="150" y="222" font-size="17" font-weight="bold" fill="#172B4D">2. Hitung biaya perpindahan</text>
      <text x="150" y="248" font-size="14" fill="#172B4D">Sering buka banyak aplikasi untuk satu kejadian? Sinyal kuat.</text>
    </g>
    <path d="M450 266 L450 296" stroke="#172B4D" stroke-width="3" marker-end="url(#ar)"/>
    <g>
      <rect x="120" y="300" width="660" height="76" rx="12" fill="#E4F2FA" stroke="#46B6E9" stroke-width="2"/>
      <text x="150" y="332" font-size="17" font-weight="bold" fill="#172B4D">3. Cek kesiapan jaringan</text>
      <text x="150" y="358" font-size="14" fill="#172B4D">Bandwidth, kabel, sinyal seluler di setiap lokasi memadai?</text>
    </g>
    <path d="M450 376 L450 406" stroke="#172B4D" stroke-width="3" marker-end="url(#ar)"/>
    <g>
      <rect x="120" y="410" width="660" height="76" rx="12" fill="#EAF6EC" stroke="#4C9E63" stroke-width="2"/>
      <text x="150" y="442" font-size="17" font-weight="bold" fill="#172B4D">4. Mulai dari yang paling menyakitkan</text>
      <text x="150" y="468" font-size="14" fill="#172B4D">Satu jenis data dulu, tambah bertahap, evaluasi berkala.</text>
    </g>
    <text x="450" y="530" text-anchor="middle" font-size="14" font-style="italic" fill="#172B4D">Layak saat biaya tidak melihat satu kejadian &gt; biaya menyatukan layar.</text>
  </g>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#172B4D"/>
    </marker>
  </defs>
</svg>
