<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img">
  <title>Checklist implementasi command center</title>
  <desc>Enam langkah checklist memulai command center: inventaris data, prioritas kejadian, kompatibilitas kamera, konektivitas, operator, dan evaluasi.</desc>
  <rect width="900" height="620" fill="#FAF7F2"/>
  <g font-family="sans-serif">
    <text x="450" y="48" text-anchor="middle" font-size="24" font-weight="bold" fill="#172B4D">Checklist Memulai Command Center</text>
    <g>
      <rect x="80" y="80" width="50" height="50" rx="10" fill="#7C5CE8"/><path d="M92 105 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="102" font-size="17" font-weight="bold" fill="#172B4D">Inventarisasi sumber data</text>
      <text x="155" y="124" font-size="14" fill="#172B4D">Jumlah kamera, kendaraan bersensor, sensor per lokasi.</text>
    </g>
    <g>
      <rect x="80" y="160" width="50" height="50" rx="10" fill="#46B6E9"/><path d="M92 185 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="182" font-size="17" font-weight="bold" fill="#172B4D">Prioritaskan 1–2 kejadian berisiko</text>
      <text x="155" y="204" font-size="14" fill="#172B4D">Yang harus terpantau pertama, bukan semuanya sekaligus.</text>
    </g>
    <g>
      <rect x="80" y="240" width="50" height="50" rx="10" fill="#7C5CE8"/><path d="M92 265 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="262" font-size="17" font-weight="bold" fill="#172B4D">Cek standar interoperabilitas kamera</text>
      <text x="155" y="284" font-size="14" fill="#172B4D">Misal dukungan ONVIF pada kamera yang sudah ada.</text>
    </g>
    <g>
      <rect x="80" y="320" width="50" height="50" rx="10" fill="#46B6E9"/><path d="M92 345 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="342" font-size="17" font-weight="bold" fill="#172B4D">Pastikan konektivitas tiap lokasi</text>
      <text x="155" y="364" font-size="14" fill="#172B4D">Video dan data sensor butuh jaringan yang stabil.</text>
    </g>
    <g>
      <rect x="80" y="400" width="50" height="50" rx="10" fill="#7C5CE8"/><path d="M92 425 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="422" font-size="17" font-weight="bold" fill="#172B4D">Tetapkan operator &amp; eskalasi</text>
      <text x="155" y="444" font-size="14" fill="#172B4D">Siapa merespons alarm apa, kapan, eskalasi ke siapa.</text>
    </g>
    <g>
      <rect x="80" y="480" width="50" height="50" rx="10" fill="#E8A25A"/><path d="M92 505 l10 10 l18 -20" stroke="#fff" stroke-width="4" fill="none"/>
      <text x="155" y="502" font-size="17" font-weight="bold" fill="#172B4D">Evaluasi 1–3 bulan</text>
      <text x="155" y="524" font-size="14" fill="#172B4D">Kejadian yang terlewat, sumber data yang perlu ditambah.</text>
    </g>
    <text x="450" y="590" text-anchor="middle" font-size="14" font-style="italic" fill="#172B4D">Mulai kecil, perluas sesuai kebutuhan operasional.</text>
  </g>
</svg>