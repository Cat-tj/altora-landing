<svg width="1200" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img">
  <title>Command center menyatukan tiga sumber data dalam satu layar</title>
  <desc>Ilustrasi lebar: video CCTV, peta armada, dan sensor IoT mengalir dari sumber berbeda menuju satu dashboard command center.</desc>
  <rect width="1200" height="480" fill="#FAF7F2"/>
  <g font-family="sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#172B4D">Satu Layar, Tiga Sumber Data</text>
    <g>
      <rect x="60" y="100" width="280" height="200" rx="14" fill="#EDE9FB" stroke="#7C5CE8" stroke-width="2"/>
      <text x="200" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#172B4D">CCTV IP</text>
      <rect x="90" y="160" width="220" height="90" rx="6" fill="#172B4D"/>
      <circle cx="200" cy="205" r="22" fill="#46B6E9"/>
      <polygon points="192,195 216,205 192,215" fill="#FAF7F2"/>
      <text x="200" y="285" text-anchor="middle" font-size="14" fill="#172B4D">Video &amp; analitik</text>
    </g>
    <g>
      <rect x="460" y="100" width="280" height="200" rx="14" fill="#E4F2FA" stroke="#46B6E9" stroke-width="2"/>
      <text x="600" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#172B4D">Armada GPS</text>
      <path d="M490 240 Q560 170 620 220 T710 190" stroke="#172B4D" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
      <circle cx="620" cy="220" r="10" fill="#7C5CE8"/>
      <circle cx="710" cy="190" r="10" fill="#7C5CE8"/>
      <text x="600" y="285" text-anchor="middle" font-size="14" fill="#172B4D">Posisi, rute, geofence</text>
    </g>
    <g>
      <rect x="860" y="100" width="280" height="200" rx="14" fill="#FDF1E4" stroke="#E8A25A" stroke-width="2"/>
      <text x="1000" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#172B4D">Sensor IoT</text>
      <rect x="900" y="170" width="40" height="80" rx="8" fill="#172B4D"/>
      <rect x="980" y="190" width="40" height="60" rx="8" fill="#172B4D"/>
      <rect x="1060" y="205" width="40" height="45" rx="8" fill="#172B4D"/>
      <text x="1000" y="285" text-anchor="middle" font-size="14" fill="#172B4D">Suhu, asap, getaran</text>
    </g>
    <path d="M340 200 L440 340" stroke="#172B4D" stroke-width="3"/>
    <path d="M600 300 L600 340" stroke="#172B4D" stroke-width="3"/>
    <path d="M860 200 L760 340" stroke="#172B4D" stroke-width="3"/>
    <polygon points="440,340 428,328 436,322" fill="#172B4D"/>
    <polygon points="600,340 592,328 608,328" fill="#172B4D"/>
    <polygon points="760,340 764,322 772,328" fill="#172B4D"/>
    <rect x="300" y="345" width="600" height="90" rx="14" fill="#172B4D"/>
    <text x="600" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="#FAF7F2">Command Center</text>
    <text x="600" y="412" text-anchor="middle" font-size="14" fill="#9AB3D6">Peta + video + alarm dalam satu sumber kebenaran</text>
  </g>
</svg>