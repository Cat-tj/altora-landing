<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Sistem Monitoring Suhu dan Asap IoT Altora</title>
  <desc>Diagram arsitektur sistem monitoring suhu dan asap berbasis IoT untuk ruang server dan gudang.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172B4D" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />

  <g transform="translate(60, 50)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#172B4D">Sistem Monitoring Suhu &amp; Asap IoT</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#626F86">Perlindungan Real-Time untuk Ruang Server &amp; Gudang Logistik di Kaltim</text>
  </g>

  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="200" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <circle cx="100" cy="70" r="28" fill="#7C5CE8" opacity="0.1" />
    <text x="100" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#7C5CE8" text-anchor="middle">IoT</text>
    <text x="100" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D" text-anchor="middle">Sensor Lapangan</text>
    <text x="100" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">Suhu, Kelembapan</text>
    <text x="100" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">&amp; Deteksi Asap 24/7</text>
  </g>

  <g transform="translate(275, 240)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#46B6E9" stroke-width="3" stroke-linecap="round" />
    <polygon points="32,-5 42,0 32,5" fill="#46B6E9" />
  </g>

  <g transform="translate(330, 140)" filter="url(#shadow)">
    <rect width="200" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <circle cx="100" cy="70" r="28" fill="#46B6E9" opacity="0.15" />
    <text x="100" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#46B6E9" text-anchor="middle">Cloud</text>
    <text x="100" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D" text-anchor="middle">Gateway &amp; Cloud</text>
    <text x="100" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">Transmisi Data Nirkabel</text>
    <text x="100" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">Stabil &amp; Aman</text>
  </g>

  <g transform="translate(545, 240)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#46B6E9" stroke-width="3" stroke-linecap="round" />
    <polygon points="32,-5 42,0 32,5" fill="#46B6E9" />
  </g>

  <g transform="translate(600, 140)" filter="url(#shadow)">
    <rect width="140" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <circle cx="70" cy="70" r="28" fill="#22C55E" opacity="0.15" />
    <text x="70" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#16A34A" text-anchor="middle">Alert</text>
    <text x="70" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D" text-anchor="middle">Peringatan</text>
    <text x="70" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">Notifikasi Instan</text>
    <text x="70" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86" text-anchor="middle">Cegah Kerusakan</text>
  </g>
</svg>
