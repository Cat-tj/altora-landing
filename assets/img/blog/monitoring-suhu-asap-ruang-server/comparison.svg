<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Perbandingan Pendekatan Pengawasan</title>
  <desc>Perbedaan efektivitas operasional antara pemeriksaan manual dan pemantauan sensor cerdas.</desc>
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172B4D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad3)" rx="12" />

  <g transform="translate(50, 40)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Perbandingan Pendekatan Pengawasan</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#626F86">Pengecekan Manual Konvensional vs Monitoring IoT Otomatis</text>
  </g>

  <g transform="translate(50, 110)" filter="url(#shadow3)">
    <rect width="330" height="235" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="8" fill="#EF4444" rx="4" />
    <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#DC2626">PENDEKATAN MANUAL / KONVENSIONAL</text>
    
    <text x="30" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">❌ Pengecekan berkala terbatas jam kerja</text>
    <text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">❌ Kerusakan AC malam hari baru diketahui pagi</text>
    <text x="30" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">❌ Tidak ada log histori fluktuasi suhu</text>
    <text x="30" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">❌ Risiko tinggi kebakaran &amp; downtime server</text>
  </g>

  <g transform="translate(420, 110)" filter="url(#shadow3)">
    <rect width="330" height="235" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="8" fill="#22C55E" rx="4" />
    <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#16A34A">SISTEM MONITORING IoT OTOMATIS</text>
    
    <text x="30" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">✓ Pemantauan aktif 24 jam penuh tanpa henti</text>
    <text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">✓ Notifikasi instan langsung ke HP saat anomali</text>
    <text x="30" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">✓ Perekaman data historis untuk audit berkala</text>
    <text x="30" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#172B4D" font-weight="600">✓ Pencegahan dini kerusakan aset &amp; server</text>
  </g>
</svg>
