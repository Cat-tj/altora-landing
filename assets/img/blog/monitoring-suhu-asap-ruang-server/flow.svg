<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <title>Alur Kerja Sistem Monitoring IoT</title>
  <desc>Tahapan otomatisasi pengawasan suhu dan asap dari sensor hingga perangkat seluler.</desc>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172B4D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad2)" rx="12" />

  <g transform="translate(50, 40)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Alur Kerja Sistem Monitoring IoT</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#626F86">Dari Deteksi Lapangan hingga Tindakan Preventif Pengelola</text>
  </g>

  <g transform="translate(50, 110)" filter="url(#shadow2)">
    <rect width="200" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="8" fill="#7C5CE8" rx="4" />
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#7C5CE8">01. SENSOR</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D">Pengukuran Udara</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">Sensor mendeteksi</text>
    <text x="25" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">suhu &gt; 28°C atau</text>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">partikel asap di udara.</text>
  </g>

  <g transform="translate(265, 215)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#46B6E9" stroke-width="3" stroke-linecap="round" />
    <polygon points="27,-5 37,0 27,5" fill="#46B6E9" />
  </g>

  <g transform="translate(310, 110)" filter="url(#shadow2)">
    <rect width="200" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="8" fill="#46B6E9" rx="4" />
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#46B6E9">02. TRANSMISI</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D">Kirim Data Cloud</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">Data dikirim via</text>
    <text x="25" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">jaringan nirkabel ke</text>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">server pusat Altora.</text>
  </g>

  <g transform="translate(525, 215)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#46B6E9" stroke-width="3" stroke-linecap="round" />
    <polygon points="27,-5 37,0 27,5" fill="#46B6E9" />
  </g>

  <g transform="translate(570, 110)" filter="url(#shadow2)">
    <rect width="180" height="230" rx="8" fill="#FFFFFF" stroke="#DEEBFF" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="8" fill="#22C55E" rx="4" />
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#16A34A">03. TINDAKAN</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#172B4D">Notifikasi &amp; Aksi</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">Alarm berbunyi dan</text>
    <text x="25" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">notifikasi masuk ke</text>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#626F86">HP penanggung jawab.</text>
  </g>
</svg>
