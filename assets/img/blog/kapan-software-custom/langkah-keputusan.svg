<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Langkah keputusan sistem</title><desc id="desc">Empat langkah: petakan proses, uji aplikasi siap pakai, tentukan ruang lingkup minimum, dan uji pengguna.</desc><rect width="1200" height="600" rx="36" fill="#FAF8F3"/><text x="70" y="90" fill="#172B4D" font-family="sans-serif" font-size="36" font-weight="700">Keputusan bertahap, risiko terkendali</text><g><circle cx="170" cy="300" r="75" fill="#EAF7FC"/><circle cx="445" cy="300" r="75" fill="#F0ECFF"/><circle cx="720" cy="300" r="75" fill="#EAF7FC"/><circle cx="995" cy="300" r="75" fill="#F0ECFF"/></g><g fill="#172B4D" font-family="sans-serif" font-size="21" font-weight="700" text-anchor="middle"><text x="170" y="292">1. Petakan</text><text x="170" y="320">proses</text><text x="445" y="292">2. Uji</text><text x="445" y="320">siap pakai</text><text x="720" y="292">3. Tentukan</text><text x="720" y="320">minimum</text><text x="995" y="292">4. Uji</text><text x="995" y="320">pengguna</text></g><g stroke="#7C5CE8" stroke-width="8"><path d="M255 300h95"/><path d="M530 300h95"/><path d="M805 300h95"/></g></svg>