<svg width="1200" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Alur keputusan POS</title><desc id="desc">Pohon keputusan untuk memilih memakai POS, merapikan proses, atau mengevaluasi kebutuhan yang lebih khusus.</desc><rect width="1200" height="540" fill="#FFFCF7"/><text x="65" y="70" fill="#172B4D" font-family="sans-serif" font-size="34" font-weight="700">Keputusan berdasarkan alur kerja</text><g font-family="sans-serif" text-anchor="middle"><rect x="410" y="115" width="380" height="75" rx="20" fill="#EEE9FC"/><text x="600" y="160" fill="#172B4D" font-size="24" font-weight="700">Rekap atau stok menghambat kerja?</text><path d="M600 190v65M600 255H265M600 255h335M265 255v55M935 255v55" stroke="#7C5CE8" stroke-width="7" fill="none"/><rect x="85" y="310" width="360" height="110" rx="22" fill="#F8E8E6"/><text x="265" y="365" fill="#172B4D" font-size="24" font-weight="700">Rapikan proses dasar</text><rect x="755" y="310" width="360" height="110" rx="22" fill="#E9F5FC"/><text x="935" y="365" fill="#172B4D" font-size="24" font-weight="700">Uji POS bertahap</text><rect x="755" y="460" width="360" height="55" rx="18" fill="#E8F6ED"/><text x="935" y="495" fill="#172B4D" font-size="21" font-weight="700">Evaluasi kebutuhan khusus</text></g></svg>