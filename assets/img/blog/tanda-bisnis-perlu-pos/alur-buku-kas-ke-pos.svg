<svg width="1200" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Alur buku kas dan POS</title><desc id="desc">Dua alur membandingkan pekerjaan ulang pada buku kas dengan pencatatan transaksi saat terjadi pada POS.</desc><rect width="1200" height="520" fill="#FFFCF7"/><text x="70" y="75" fill="#172B4D" font-family="sans-serif" font-size="34" font-weight="700">Dari pekerjaan ulang ke catat sekali</text><rect x="70" y="125" width="490" height="315" rx="24" fill="#F8E8E6"/><text x="105" y="180" fill="#172B4D" font-family="sans-serif" font-size="26" font-weight="700">Buku kas</text><text x="110" y="245" fill="#172B4D" font-family="sans-serif" font-size="22">Transaksi ditulis</text><text x="110" y="305" fill="#172B4D" font-family="sans-serif" font-size="22">Rekap dihitung ulang</text><text x="110" y="365" fill="#172B4D" font-family="sans-serif" font-size="22">Selisih ditelusuri lagi</text><rect x="640" y="125" width="490" height="315" rx="24" fill="#E9F5FC"/><text x="675" y="180" fill="#172B4D" font-family="sans-serif" font-size="26" font-weight="700">POS</text><text x="680" y="245" fill="#172B4D" font-family="sans-serif" font-size="22">Transaksi dicatat saat terjadi</text><text x="680" y="305" fill="#172B4D" font-family="sans-serif" font-size="22">Data jadi dasar rekap</text><text x="680" y="365" fill="#172B4D" font-family="sans-serif" font-size="22">Koreksi punya jejak</text></svg>