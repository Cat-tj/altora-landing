<svg width="1200" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Lima sinyal perlu POS</title><desc id="desc">Lima kartu berisi antrean, stok, tutup kas, shift, dan keputusan sebagai sinyal evaluasi POS.</desc><rect width="1200" height="540" fill="#FFFCF7"/><text x="65" y="75" fill="#172B4D" font-family="sans-serif" font-size="34" font-weight="700">Sinyal yang perlu diperiksa</text><g font-family="sans-serif" fill="#172B4D"><rect x="65" y="130" width="200" height="280" rx="22" fill="#EEE9FC"/><text x="95" y="255" font-size="24" font-weight="700">Antrean</text><text x="95" y="310" font-size="19">Pencatatan</text><rect x="285" y="130" width="200" height="280" rx="22" fill="#E9F5FC"/><text x="315" y="255" font-size="24" font-weight="700">Stok</text><text x="315" y="310" font-size="19">Sulit dilacak</text><rect x="505" y="130" width="200" height="280" rx="22" fill="#FFF0DF"/><text x="535" y="255" font-size="24" font-weight="700">Kas</text><text x="535" y="310" font-size="19">Tutup lama</text><rect x="725" y="130" width="200" height="280" rx="22" fill="#E8F6ED"/><text x="755" y="255" font-size="24" font-weight="700">Shift</text><text x="755" y="310" font-size="19">Info berpindah</text><rect x="945" y="130" width="190" height="280" rx="22" fill="#F8E8E6"/><text x="970" y="255" font-size="24" font-weight="700">Keputusan</text><text x="970" y="310" font-size="19">Masih perkiraan</text></g></svg>