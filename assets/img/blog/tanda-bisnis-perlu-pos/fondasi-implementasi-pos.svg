<svg width="1200" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">Fondasi implementasi POS</title><desc id="desc">Lima tahap persiapan sebelum memakai POS: katalog, aturan, peran, perangkat, dan masa uji.</desc><rect width="1200" height="450" fill="#FFFCF7"/><text x="65" y="72" fill="#172B4D" font-family="sans-serif" font-size="34" font-weight="700">Siapkan fondasi sebelum sistem</text><path d="M170 230H1030" stroke="#7C5CE8" stroke-width="8"/><g font-family="sans-serif" text-anchor="middle" fill="#172B4D" font-size="23" font-weight="700"><circle cx="180" cy="230" r="43" fill="#7C5CE8"/><text x="180" y="325">Katalog</text><circle cx="395" cy="230" r="43" fill="#7C5CE8"/><text x="395" y="325">Aturan</text><circle cx="610" cy="230" r="43" fill="#7C5CE8"/><text x="610" y="325">Peran</text><circle cx="825" cy="230" r="43" fill="#7C5CE8"/><text x="825" y="325">Perangkat</text><circle cx="1040" cy="230" r="43" fill="#7C5CE8"/><text x="1040" y="325">Masa uji</text></g></svg>