<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto" style="background:#FAF8F5;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;">
  <text x="40" y="44" font-size="20" font-weight="800" fill="#172B4D">4 Tahapan Implementasi Turnkey ERP Maritim Altora</text>
  <text x="40" y="68" font-size="13" font-weight="500" fill="#6B778C">Metodologi Deployment Terstruktur Tanpa Mengganggu Kelancaran Operasi Kapal</text>

  <!-- Step 1 -->
  <g transform="translate(40, 105)">
    <circle cx="28" cy="28" r="24" fill="#E8E0F7" stroke="#7C5CE8" stroke-width="2"/>
    <text x="28" y="35" font-size="16" font-weight="800" fill="#7C5CE8" text-anchor="middle">1</text>
    <rect x="70" y="0" width="650" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="90" y="22" font-size="13" font-weight="700" fill="#1E293B">Audit Lapangan &amp; Pemetaan Alur Kontrak (Minggu 1-2)</text>
    <text x="90" y="40" font-size="11" font-weight="500" fill="#64748B">Identifikasi variasi SPAL, alur bunker jetty, titik blankspot Mahakam, &amp; integrasi flowmeter fisik kapal.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(40, 165)">
    <circle cx="28" cy="28" r="24" fill="#E1F0FA" stroke="#0284C7" stroke-width="2"/>
    <text x="28" y="35" font-size="16" font-weight="800" fill="#0284C7" text-anchor="middle">2</text>
    <rect x="70" y="0" width="650" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="90" y="22" font-size="13" font-weight="700" fill="#1E293B">Konfigurasi Modul Maritim &amp; Arsitektur Zero Trust (Minggu 3-4)</text>
    <text x="90" y="40" font-size="11" font-weight="500" fill="#64748B">Pemasangan edge buffer telemetri kapal, segmentasi data aman NIST SP 800-207, &amp; template SPAL digital.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(40, 225)">
    <circle cx="28" cy="28" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="28" y="35" font-size="16" font-weight="800" fill="#D97706" text-anchor="middle">3</text>
    <rect x="70" y="0" width="650" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="90" y="22" font-size="13" font-weight="700" fill="#1E293B">Pilot Run Voyage &amp; Pelatihan Kru Darat-Laut (Minggu 5-6)</text>
    <text x="90" y="40" font-size="11" font-weight="500" fill="#64748B">Uji coba 2-3 set armada tug &amp; barge rute Muara Berau / Balikpapan, pelatihan tally man &amp; finance admin.</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(40, 285)">
    <circle cx="28" cy="28" r="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="28" y="35" font-size="16" font-weight="800" fill="#16A34A" text-anchor="middle">4</text>
    <rect x="70" y="0" width="650" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="90" y="22" font-size="13" font-weight="700" fill="#1E293B">Rollout Penuh &amp; Dashboard Kendali Terpusat (Minggu 7+)</text>
    <text x="90" y="40" font-size="11" font-weight="500" fill="#64748B">Live pemantauan seluruh armada dari Command Center Samarinda / Balikpapan dengan dukungan SLA 24/7.</text>
  </g>
</svg>
