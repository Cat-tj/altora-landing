<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="auto" style="background:#FAF8F5;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;">
  <text x="40" y="44" font-size="20" font-weight="800" fill="#172B4D">Alur Pengambilan Keputusan Voyage &amp; Billing Maritim</text>
  <text x="40" y="68" font-size="13" font-weight="500" fill="#6B778C">Otomasi Alur Dokumen dari Jetty Muat hingga Tagihan Lunas di ERP Altora</text>

  <!-- Step 1 -->
  <g transform="translate(40, 110)">
    <rect width="150" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#7C5CE8"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. SPAL / KONTRAK</text>
    
    <text x="15" y="65" font-size="11" font-weight="700" fill="#1E293B">Input Freight Rate</text>
    <text x="15" y="85" font-size="10" font-weight="500" fill="#64748B">• Rute Jetty ke Mother Vessel</text>
    <text x="15" y="105" font-size="10" font-weight="500" fill="#64748B">• Target tonase minimum</text>
    <text x="15" y="125" font-size="10" font-weight="500" fill="#64748B">• Kesepakatan demurrage/hari</text>
    <text x="15" y="155" font-size="10" font-weight="700" fill="#7C5CE8">Lock Term Kontrak →</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 195 200 L 220 200" stroke="#7C5CE8" stroke-width="2"/>
  <polygon points="220,196 226,200 220,204" fill="#7C5CE8"/>

  <!-- Step 2 -->
  <g transform="translate(230, 110)">
    <rect width="150" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#7C5CE8"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. OPERASI &amp; BUNKER</text>
    
    <text x="15" y="65" font-size="11" font-weight="700" fill="#1E293B">Pelayaran Armada</text>
    <text x="15" y="85" font-size="10" font-weight="500" fill="#64748B">• Tracking posisi Tugboat</text>
    <text x="15" y="105" font-size="10" font-weight="500" fill="#64748B">• Konsumsi solar otomatis</text>
    <text x="15" y="125" font-size="10" font-weight="500" fill="#64748B">• Pencatatan jam tunggu labuh</text>
    <text x="15" y="155" font-size="10" font-weight="700" fill="#7C5CE8">Validasi Data Site →</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 385 200 L 410 200" stroke="#7C5CE8" stroke-width="2"/>
  <polygon points="410,196 416,200 410,204" fill="#7C5CE8"/>

  <!-- Step 3 -->
  <g transform="translate(420, 110)">
    <rect width="150" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#7C5CE8"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. TALLY &amp; SURVEY</text>
    
    <text x="15" y="65" font-size="11" font-weight="700" fill="#1E293B">Bongkar Muat</text>
    <text x="15" y="85" font-size="10" font-weight="500" fill="#64748B">• Draft survey muatan (MT)</text>
    <text x="15" y="105" font-size="10" font-weight="500" fill="#64748B">• Berita acara STS transfer</text>
    <text x="15" y="125" font-size="10" font-weight="500" fill="#64748B">• Surat jalan digital</text>
    <text x="15" y="155" font-size="10" font-weight="700" fill="#7C5CE8">Kompilasi Dokumen →</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 575 200 L 600 200" stroke="#7C5CE8" stroke-width="2"/>
  <polygon points="600,196 606,200 600,204" fill="#7C5CE8"/>

  <!-- Step 4 -->
  <g transform="translate(610, 110)">
    <rect width="150" height="180" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#10B981"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. INVOICE &amp; HPP</text>
    
    <text x="15" y="65" font-size="11" font-weight="700" fill="#065F46">Tagihan &amp; Laporan</text>
    <text x="15" y="85" font-size="10" font-weight="500" fill="#1E293B">• Invoice otomatis terbit</text>
    <text x="15" y="105" font-size="10" font-weight="500" fill="#1E293B">• Lampiran demurrage presisi</text>
    <text x="15" y="125" font-size="10" font-weight="500" fill="#1E293B">• Laba kotor per trip terekam</text>
    <text x="15" y="155" font-size="10" font-weight="700" fill="#10B981">Pencairan Lancar ✓</text>
  </g>

  <!-- Bottom status note -->
  <rect x="40" y="320" width="720" height="36" rx="6" fill="#F4F5F7"/>
  <text x="400" y="343" font-size="11" font-weight="600" fill="#42526E" text-anchor="middle">Efisiensi Siklus Penagihan: Dokumen tonase, demurrage, dan berita acara tersusun begitu bongkar selesai.</text>
</svg>
