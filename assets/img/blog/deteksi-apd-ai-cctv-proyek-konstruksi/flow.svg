<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Cakupan Objek Deteksi AI CCTV</title>
  <desc>Ilustrasi parameter dan perlengkapan keselamatan kerja yang dipantau oleh sistem komputer.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="85" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172B4D">Parameter Utama yang Dipantau</text>
  
  <rect x="80" y="140" width="180" height="200" rx="6" fill="#F4F2FF" stroke="#7C5CE8" stroke-width="1"/>
  <text x="170" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7C5CE8" text-anchor="middle">Helm Safety</text>
  <text x="170" y="220" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Memastikan warna</text>
  <text x="170" y="240" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">dan kelengkapan</text>
  <text x="170" y="260" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">pelindung kepala</text>

  <rect x="310" y="140" width="180" height="200" rx="6" fill="#EBF8FF" stroke="#46B6E9" stroke-width="1"/>
  <text x="400" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284C7" text-anchor="middle">Rompi Reflektif</text>
  <text x="400" y="220" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Visibilitas pekerja</text>
  <text x="400" y="240" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">di area operasional</text>
  <text x="400" y="260" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">alat berat & malam</text>

  <rect x="540" y="140" width="180" height="200" rx="6" fill="#F4F2FF" stroke="#7C5CE8" stroke-width="1"/>
  <text x="630" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7C5CE8" text-anchor="middle">Sepatu Safety</text>
  <text x="630" y="220" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">Pelindung kaki</text>
  <text x="630" y="240" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">dari risiko benturan</text>
  <text x="630" y="260" font-family="sans-serif" font-size="13" fill="#172B4D" text-anchor="middle">dan material jatuh</text>
</svg>