<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Perbandingan Pengawasan Manual vs AI CCTV</title>
  <desc>Matriks perbandingan efektivitas pengawasan keselamatan kerja antara metode konvensional dan sistem otomatis.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="85" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172B4D">Perbandingan Pengawasan K3</text>
  
  <rect x="80" y="120" width="300" height="240" rx="6" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="1"/>
  <text x="230" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#C53030" text-anchor="middle">Pengawasan Manual</text>
  <text x="110" y="200" font-family="sans-serif" font-size="13" fill="#172B4D">- Bergantung pada kehadiran fisik</text>
  <text x="110" y="230" font-family="sans-serif" font-size="13" fill="#172B4D">- Rentan kelelahan & titik buta</text>
  <text x="110" y="260" font-family="sans-serif" font-size="13" fill="#172B4D">- Pencatatan insiden terlambat</text>
  <text x="110" y="290" font-family="sans-serif" font-size="13" fill="#172B4D">- Cakupan area terbatas</text>

  <rect x="420" y="120" width="300" height="240" rx="6" fill="#F0FFF4" stroke="#9AE6B4" stroke-width="1"/>
  <text x="570" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#22543D" text-anchor="middle">AI CCTV Otomatis</text>
  <text x="450" y="200" font-family="sans-serif" font-size="13" fill="#172B4D">- Berjalan 24/7 tanpa henti</text>
  <text x="450" y="230" font-family="sans-serif" font-size="13" fill="#172B4D">- Deteksi serentak banyak pekerja</text>
  <text x="450" y="260" font-family="sans-serif" font-size="13" fill="#172B4D">- Notifikasi peringatan instan</text>
  <text x="450" y="290" font-family="sans-serif" font-size="13" fill="#172B4D">- Arsip data & audit terstruktur</text>
</svg>