<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <title>Sistem Deteksi APD dengan AI CCTV pada Proyek Konstruksi</title>
  <desc>Diagram alur kerja pemantauan Alat Pelindung Diri secara otomatis menggunakan kecerdasan buatan.</desc>
  <rect width="100%" height="100%" fill="#F8F9FA" rx="12"/>
  <rect x="40" y="40" width="720" height="370" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="85" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172B4D">Alur Kerja Deteksi APD Otomatis</text>
  
  <rect x="80" y="140" width="160" height="180" rx="6" fill="#F4F2FF" stroke="#7C5CE8" stroke-width="1.5"/>
  <text x="160" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7C5CE8" text-anchor="middle">1. Kamera CCTV</text>
  <text x="160" y="215" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">Menangkap video</text>
  <text x="160" y="235" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">area kerja proyek</text>
  <text x="160" y="255" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">secara real-time</text>

  <line x1="240" y1="230" x2="290" y2="230" stroke="#46B6E9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="140" width="160" height="180" rx="6" fill="#EBF8FF" stroke="#46B6E9" stroke-width="1.5"/>
  <text x="370" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284C7" text-anchor="middle">2. Edge AI Model</text>
  <text x="370" y="215" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">Analisis visual</text>
  <text x="370" y="235" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">helm, rompi, dan</text>
  <text x="370" y="255" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">sepatu safety</text>

  <line x1="450" y1="230" x2="500" y2="230" stroke="#46B6E9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="140" width="220" height="180" rx="6" fill="#F4F2FF" stroke="#7C5CE8" stroke-width="1.5"/>
  <text x="610" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7C5CE8" text-anchor="middle">3. Peringatan & Log</text>
  <text x="610" y="215" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">Notifikasi instan ke</text>
  <text x="610" y="235" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">pengawas K3 dan</text>
  <text x="610" y="255" font-family="sans-serif" font-size="12" fill="#172B4D" text-anchor="middle">rekaman pelanggaran</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46B6E9"/>
    </marker>
  </defs>
</svg>