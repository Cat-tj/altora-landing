<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <title>Alur Penggunaan Anjungan Layanan Mandiri</title>
  <desc>Diagram langkah demi langkah penggunaan kios mandiri kelurahan.</desc>
  <rect width="800" height="350" fill="#F8F9FA"/>

  <!-- Step 1 -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#7C5CE8"/>
    <text x="100" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="100" y="110" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Autentikasi</text>
    <text x="100" y="135" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">Scan KTP atau QR code</text>
    <text x="100" y="155" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">untuk verifikasi data.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#46B6E9"/>
    <text x="100" y="58" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="100" y="110" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pilih Layanan</text>
    <text x="100" y="135" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">Pilih jenis surat atau</text>
    <text x="100" y="155" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">keperluan administrasi.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 70)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#172B4D"/>
    <text x="100" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="100" y="110" fill="#172B4D" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cetak Dokumen</text>
    <text x="100" y="135" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">Verifikasi tanda tangan</text>
    <text x="100" y="155" fill="#64748B" font-family="sans-serif" font-size="13" text-anchor="middle">digital &amp; cetak mandiri.</text>
  </g>

  <!-- Connectors -->
  <line x1="255" y1="170" x2="295" y2="170" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="505" y1="170" x2="545" y2="170" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>
</svg>
