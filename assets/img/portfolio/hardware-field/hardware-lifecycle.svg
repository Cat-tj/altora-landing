<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="t d"><title id="t">Alur pengadaan, instalasi, dan maintenance hardware Altora</title><desc id="d">Enam tahapan layanan dari pemetaan kebutuhan hingga perawatan berkala.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5FF"/><stop offset="1" stop-color="#EFFAFF"/></linearGradient><filter id="s" x="-15%" y="-30%" width="130%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172B4D" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7C5CE8"/></marker></defs><rect width="1440" height="520" rx="32" fill="url(#g)"/><circle cx="1310" cy="55" r="170" fill="#D9CEFF" opacity=".5"/><circle cx="100" cy="495" r="190" fill="#CDEFFF" opacity=".5"/><text x="72" y="86" fill="#172B4D" font-family="Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3">ALTORA HARDWARE DELIVERY</text><text x="72" y="134" fill="#172B4D" font-family="Arial,sans-serif" font-size="40" font-weight="800">Dari kebutuhan lapangan sampai perangkat tetap terawat.</text><g stroke="#7C5CE8" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M270 302h62"/><path d="M494 302h62"/><path d="M718 302h62"/><path d="M942 302h62"/><path d="M1166 302h62"/></g><g filter="url(#s)"><rect x="72" y="230" width="198" height="155" rx="24" fill="#fff"/><rect x="296" y="230" width="198" height="155" rx="24" fill="#fff"/><rect x="520" y="230" width="198" height="155" rx="24" fill="#fff"/><rect x="744" y="230" width="198" height="155" rx="24" fill="#fff"/><rect x="968" y="230" width="198" height="155" rx="24" fill="#fff"/><rect x="1192" y="230" width="176" height="155" rx="24" fill="#fff"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#7C5CE8" font-size="18" font-weight="800"><text x="171" y="270">01</text><text x="395" y="270">02</text><text x="619" y="270">03</text><text x="843" y="270">04</text><text x="1067" y="270">05</text><text x="1280" y="270">06</text></g><g fill="#172B4D" font-size="22" font-weight="800"><text x="171" y="310">Pemetaan</text><text x="171" y="338">kebutuhan</text><text x="395" y="310">Pengadaan</text><text x="619" y="310">Instalasi</text><text x="843" y="310">Uji fungsi</text><text x="1067" y="310">Serah terima</text><text x="1280" y="310">Maintenance</text></g><g fill="#5F6680" font-size="15"><text x="171" y="367">Lokasi, perangkat,</text><text x="171" y="386">dan alur kerja</text><text x="395" y="367">Spesifikasi dan</text><text x="395" y="386">kebutuhan dokumen</text><text x="619" y="367">Perangkat, kabel,</text><text x="619" y="386">dan konfigurasi</text><text x="843" y="367">Cek bersama</text><text x="843" y="386">pengguna</text><text x="1067" y="367">Akses, catatan,</text><text x="1067" y="386">dan dokumentasi</text><text x="1280" y="367">Pemeriksaan</text><text x="1280" y="386">berkala</text></g></g><text x="72" y="465" fill="#53657C" font-family="Arial,sans-serif" font-size="18">Cakupan pekerjaan mengikuti hasil survei, kebutuhan lokasi, dan kesepakatan layanan.</text></svg>
